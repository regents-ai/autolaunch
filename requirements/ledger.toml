# C5 adds one gate-dependency claim of its own. The freezer is the only writer of the frozen
# ABI, surface, size and manifest documents, and the only producer of this claim's receipt
# line. Deleting `bin/freeze-artifacts.py check` from `bin/gate.sh` therefore does not
# quietly stop checking the freeze — it leaves DEP-016 without its verified receipt and
# fails the ledger reconciliation.
#
# regent-alv1.6.1 correction. The C5 statement asserted that every src/** byte equals the C4
# capture. That was true while C5's only production edit was a comment, and it is obsolete the
# moment a successor corrects production behaviour. Relaxing it silently would have been worse
# than replacing it, so the universal claim becomes an enumerated one: the historical C4 capture
# stays immutable and byte-identical, exactly the contracts the frozen final-source-delta record
# names may differ, each of them must really differ, and every other contract must still match.
[[requirement]]
id = "DEP-016"
statement = "The required gate regenerates every frozen ABI, surface, size and manifest document from the compiled artifacts in check mode and fails on any byte of drift; the historical C4 runtime capture stays byte-identical to the blob its capture commit committed directly on integrated C4; exactly the src/** contracts the frozen final-source-delta record names may differ from that capture and each of them must actually differ; and every other src/** contract's runtime and creation byte strings still equal it exactly. The gate proves which production bytes moved, never why they moved."
owner = "C5"
contract = "repository"
evidence_class = "gate-dependency"
gate = "hermetic"
status = "active"
selectors = ["test_DEP_016_FrozenManifestRecordsTheAdmittedIdentitiesAndNoDeployment"]

