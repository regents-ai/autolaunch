# Claim-level requirement ledger (SPEC.md section 9).
#
# One entry per frozen normative Solidity claim. Every entry carries at least one exact
# planned Foundry selector: the selector namespace is a stable contract fixed now, so a
# later ticket implements the claim its predecessor named instead of inventing one.
#
# Activation is two-dimensional, and a claim is active only when BOTH switches are on:
#
#   activated_tickets   the owning ticket's work has landed;
#   activated_gates     the gate that class of evidence must run under is authorized.
#
# An activated ticket may therefore still hold claims pending, but only when their
# designated gate is not activated. That was the earlier offline C5 state; the C5 evidence
# activation candidate turned on both C5 and the separately authorized fork gate, and this
# regent-alv1.7 successor adds C6. Once a claim's owner and its gate are both activated, the
# claim MUST be active. Activation is not execution: this candidate changed four production
# contracts, so the fork gate has to run again against its bytecode under the founder's
# separate read-only authority before the fork claims carry evidence for it.
#
# status = "active"   the claim's selectors must exist, must execute exactly once under the
#                     designated gate, and must pass; a gate-dependency claim additionally
#                     requires the gate's own verified receipt for its ID.
# status = "pending"  the claim's selectors are reserved names only. They need not exist,
#                     they may not be executed against this ID, and nothing can mark the
#                     claim complete. A pending selector is never evidence.
#
# bin/check-requirements.py enforces every rule above, plus global selector uniqueness and
# the requirement-ID prefix of each selector, and reconciles the executed test multiset
# against Foundry's own compiled listing.

[ledger]
version = 1
authority = "SPEC.md"
activated_tickets = ["C0", "C1", "C2", "C3", "C4", "C5", "C6", "C6.1"]

# `fork` is activated only with the separately discovered, independently reviewed, and
# committed Base observation record. The compare-only gate must execute every mapped fork
# selector exactly once, against the production bytecode of the candidate being closed. Every
# fork claim is proved at the committed pinned header; a named subset — DEP-040, DEP-041,
# DEP-042, DEP-043, DEP-047, DEP-050, DEP-051, DEP-052 and GAS-006 — is proved again at the
# later head, and each claim's selector list below is the enumeration of where it runs.
activated_gates = ["hermetic", "invariant", "fork"]
groups = [
    "DEP",
    "FAC",
    "TOK",
    "STR",
    "ESC",
    "HOK",
    "SPL",
    "RCV",
    "MIG",
    "FAIL",
    "INV",
    "GAS",
    "ABI",
]

