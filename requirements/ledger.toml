# ---------------------------------------------------------------------------
# GAS — every runtime and initcode limit plus the complete direct-wallet launch,
#       successful migration, and failed migration at or below 14M under maximum
#       metadata, worst valid raise/inventory, cold external state, intrinsic
#       gas, and calldata gas
#
# GAS-001/002 are hermetic because a runtime or initcode size is a compile-time
# fact. GAS-003 through GAS-006 are fork-only: cold deployed external state,
# intrinsic transaction cost, and calldata cost are not reachable from a
# hermetic mock, so no hermetic test may close them.
