[[requirement]]
id = "INV-009"
statement = "Across every reachable interleaving of bid, block progression, migration, vesting release, late retirement, and external-gift operations over three simultaneous launches created in one block, no launch's 5% LP reserve is ever consumed by, credited to, or reachable from another launch, and each launch's SUBJECT held by the shared strategy is attributable to that launch alone. Launch creation itself is not one of the interleaved operations: the three launches are created before the sequence begins, and STR-012 owns single-operation creation isolation."
