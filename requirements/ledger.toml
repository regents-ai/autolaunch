# regent-alv1.7 rewrite. C6 deletes the recovery administrator outright, so the surviving half of
# the regent-alv1.6.1 claim — the strategy's own RecoveryAdminHasNoCode(address) — is deleted too
# and the claim is restated as the whole-surface deletion it now is. A hard-deleted selector is
# proved by ABI diff, never by calling it. A runtime byte scan is deliberately excluded for the
# errors: it is sound for a deleted function, whose dispatcher must carry the selector literally,
# and ABI-009 uses it there, but under this repository's via-IR build solc rewrites a custom
# error's revert prologue constant into whatever encoding is cheapest, so a live error's four
# selector bytes can be absent from the runtime and a scan would prove nothing either way.
[[requirement]]
id = "ABI-012"
statement = "The whole recovery-administration ABI surface is deleted: the strategy's RecoveryAdminHasNoCode(address) selector 0xa6397a8c, the earlier splitter RecoveryAdminHasNoCode() selector 0x4f986444, the splitter's and receiver's NotRecoveryAdmin(address) error, and the splitter's and receiver's recoveryAdmin() getter appear on no production contract's frozen surface, and no generated per-contract ABI document names a recovery admin under any name, arity or member kind. Recovery itself survives in its amount-free permissionless form on both clones."
owner = "C5"
contract = "system"
evidence_class = "solidity-hermetic"
gate = "hermetic"
status = "active"
selectors = ["test_ABI_012_DeletedRecoveryAdministrationSurfaceIsAbsent"]
