statement = "Before any fork claim executes, the selected fork's block number, parent block number, parent block hash, timestamp, base fee, and chain id are each compared against the committed observation record for that header; and the two committed headers are exactly the fixed pinned-to-later distance apart, each record's parent number is its own predecessor, and the later header's timestamp is strictly greater than the pinned header's."
