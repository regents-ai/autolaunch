# regent-alv1.7 addition, corrected by regent-alv1.7.1. The system's one launch-time treasury
# admission, owned by the strategy and run after the escrow is authenticated and before the auction
# exists. The refusal set is closed and exact: six shared-system destinations by address, and
# nothing else. C6's clone-runtime fingerprint and future-slot rules are deleted along with the
# CREATE2 machinery they depended on, so an already-deployed escrow, splitter or receiver, and an
# address a later ordinary-CREATE clone will occupy, are all admitted. The nonce-dependent stall
# that admission produces is bounded and recoverable, and is proved rather than prevented. There is
# no registry, no generalized denylist and no code-presence requirement.
