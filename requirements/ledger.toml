contract = "BaseBindings"
evidence_class = "fork-execution"
gate = "fork"
status = "active"
selectors = [
    "test_DEP_052_ForkPinnedHeaderIsFullyBoundToTheCommittedRecord",
    "test_DEP_052_ForkLatestHeaderIsFullyBoundToTheCommittedRecord",
]

# regent-alv1.6.1 addition, narrowed and extended by regent-4wx. The founder-authorized
# exact-production lifecycle suite: the whole Autolaunch path, deployed from the exact final
# artifacts and driven through production-reachable callers against the real frozen Base bindings.
# One lifecycle portfolio runs, at the committed pinned header; the fresh-head subset does not
# repeat it. The existing focused fork claims and the complete-transaction gas claims stay separate
# named proofs; this one is the end-to-end path they each cut one slice out of. The C9 supply-
# coverage division and the C10 exact-supply binding, explicit recognition amounts and delayed value
# exits are now proved here on the real path rather than assumed from the hermetic gate.
[[requirement]]
id = "DEP-053"
statement = "On Base at the committed pinned header, one suite deploys the exact final production UERC20 factory, C1 implementations, factory, strategy, and mined hook, reconciles their creation and runtime code identities against the frozen build, and then — through production-reachable callers only, against the real CCA, Permit2, REGENT, USDC, live staking, PoolManager, and PositionManager bindings — drives exact wallet fee approval and launch, five-argument bidding, a failed auction with full bidder refund and exactly 100 billion SUBJECT retired to the dead address, a graduated auction migrating at the CCA final price with bidder exit and SUBJECT claim, SUBJECT stake, canonical receiver payments in USDC, REGENT, and SUBJECT, splitter skims, a bound splitter whose SUBJECT reports exactly the 100 billion supply its initialization requires, a same-block unstake, claim and claimAll each refused with the exact SameBlockStakeExit(account, stakeBlock) while principal, entitlement, splitter inventory and protected inventory all stay put, and, exactly one block later, a claim, a claimAll and a complete unstake that return the exact entitlements and exactly the principal, and at least one real Uniswap v4 swap that synchronously settles both one-percent REGENT hook lanes and leaves the hook no inventory. For every recognition — the three payments and the splitter's own hook lane alike — it reads that recognition's own RevenueRecognized back out of the run's logs, holds its gross, skim, net, stakerShare and treasuryShare to independently derived arithmetic and to gross == skim + stakerShare + treasuryShare, and then asserts the reported stakerShare — the floored supply-coverage share floor(net * totalStaked / 100000000000e18) — as both the staker liability delta and the splitter's held delta, and the reported treasuryShare as the launch treasury's delta in that same transaction. It asserts exact final balances and allowances, both lifecycles, dead-address ownership of the LP NFT, the position's actual consumption and both residues, and that no production contract holds an unexplained balance. Test-only funding and routing is itemized and manufactures no protocol authority, code, custody, or otherwise unreachable state."
owner = "C5"
contract = "system"
evidence_class = "fork-execution"
gate = "fork"
status = "active"
selectors = ["test_DEP_053_ForkPinnedCompleteProductionLifecycleExecutesEndToEnd"]

# Repository-owned code, so this stays hermetic: the escrow, splitter, and receiver
