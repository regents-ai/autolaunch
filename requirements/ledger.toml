# Claim-level requirement ledger (SPEC.md section 9).
#
# One entry per frozen normative Solidity claim. `bin/check-requirements.py` reconciles this
# file against the tests enumerated from the pinned source tree and against the dependency
# receipt written by `bin/gate.sh`.
#
# status = "active"  the owning ticket's gate is due now; the claim must map to an existing
#                    selector that executed exactly once, or to a verified gate check.
# status = "pending" the owning ticket's gate has not activated; the claim carries no selector
#                    and no test may claim its ID. Nothing can mark it complete.
#
# A claim becomes active only by adding its owning ticket to `activated_tickets` below, which is
# the single switch that turns a future ticket's claims into mandatory executed evidence.

[ledger]
version = 1
authority = "SPEC.md"
activated_tickets = ["C0"]
groups = [
    "DEP",
    "FAC",
    "TOK",
    "STR",
    "ESC",
    "HOK",
    "SPL",
    "RCV",
    "MIG",
    "FAIL",
    "INV",
    "GAS",
    "ABI",
]

