# C5 addition, corrected by regent-alv1.6.1. The supported hook callbacks' cold and warm cost is
# recorded separately rather than hidden inside the three complete-transaction totals. The earlier
# statement also held the measurement to a 100,000-gas target and a 300,000-gas ceiling; neither
# value exists in Uniswap v4, in any pinned dependency, or in a founder requirement, so both
# literals and their pass/fail assertions are removed and this claim records its measurements
# instead of inventing a protocol limit. The 14,000,000 complete-transaction ceiling is the only
# absolute gas limit this repository asserts, and GAS-003 through GAS-006 own it.
[[requirement]]
id = "GAS-007"
statement = "The supported hook callbacks' cold and warm gas, and a second supported router's own sync/settle timing, are measured as a controlled difference against a zero-lane swap one wei apart on an identically built pool, and are reconciled by the gate against the figures the audit packet publishes. The measurement asserts only what it establishes: the charging swap costs more than its zero-lane control cold and warm, warm is cheaper than cold in both pairs, a production-sized lane is dearer than a boundary one, and the hook retains neither REGENT nor a splitter allowance. No absolute callback gas limit is asserted, because no pinned dependency or founder requirement states one; the alternate-router total is recorded only. The cold figure is the posture a real user transaction meets on a pool's first swap; the warm figure is only the control that proves the cold one was cold."
owner = "C5"
contract = "RegentFeeHook"
evidence_class = "solidity-hermetic"
gate = "hermetic"
status = "active"
selectors = ["test_GAS_007_HookCallbackAndRouterSettlementGasAreMeasured"]

# regent-4wx narrowing. The three envelopes are measured at the committed pinned header. The gas
# schedule they apply is read from the committed observation for the header being measured, and
# GAS-006 — the claim about what the figure is — still runs at both headers.
[[requirement]]
id = "GAS-003"
statement = "On the authorized Base fork at the committed pinned header, the complete direct-wallet launch transaction stays at or below 14,000,000 gas under the worst admitted conditions: maximum-length metadata, the worst valid required raise, and cold deployed external state."
owner = "C5"
contract = "AutolaunchFactory"
evidence_class = "fork-execution"
gate = "fork"
status = "active"
selectors = ["test_GAS_003_ForkPinnedCompleteLaunchStaysUnderFourteenMillion"]

[[requirement]]
id = "GAS-004"
statement = "On the authorized Base fork at the committed pinned header, the complete successful migration transaction stays at or below 14,000,000 gas under the worst admitted conditions, including cold deployed external state and the largest admitted pool and inventory state."
owner = "C5"
contract = "migration"
evidence_class = "fork-execution"
gate = "fork"
status = "active"
selectors = ["test_GAS_004_ForkPinnedCompleteGraduationStaysUnderFourteenMillion"]

[[requirement]]
id = "GAS-005"
statement = "On the authorized Base fork at the committed pinned header, the complete failed migration transaction stays at or below 14,000,000 gas under the worst admitted conditions, including cold deployed external state."
owner = "C5"
contract = "migration"
evidence_class = "fork-execution"
gate = "fork"
status = "active"
selectors = ["test_GAS_005_ForkPinnedCompleteFailureRetirementStaysUnderFourteenMillion"]

# The shared measurement method behind GAS-003, GAS-004, and GAS-005, proved once at each committed
# header. It does not restate their caps: it proves that the number each of them compares against
# 14,000,000 is the full outer transaction, intrinsic gas and calldata gas included.
[[requirement]]
id = "GAS-006"
statement = "On the authorized Base fork, at the committed pinned header and again at the later head, the gas figure measured for every complete-transaction claim is the full outer transaction, including the intrinsic transaction cost and the calldata cost, and not an inner call's gas."
owner = "C5"
contract = "system"
evidence_class = "fork-execution"
gate = "fork"
status = "active"
selectors = [
    "test_GAS_006_ForkPinnedMeasurementCoversTheFullOuterTransaction",
    "test_GAS_006_ForkLatestMeasurementCoversTheFullOuterTransaction",
]

