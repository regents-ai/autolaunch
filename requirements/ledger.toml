statement = "The factory, the strategy, and the hook hold no attributable balance of SUBJECT, REGENT, or USDC beyond what the specified flows account for, and no named allowance beyond what an in-flight specified flow requires: an explained external gift is never counted as protocol inventory, is never spendable as another launch's budget, and never blocks any other flow."
