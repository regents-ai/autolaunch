[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]

# Frozen build identity. Every value below is governed by one SPEC.md section 3 line,
# which bin/gate.sh parses directly:
#
#   - Solidity `0.8.26`, Cancun EVM target, optimizer `200`, via-IR, bytecode metadata
#     disabled
#
# "bytecode metadata disabled" is one specification decision with the two Solidity
# settings bytecode_hash = none and cbor_metadata = false behind it. The gate compares
# the spec-derived values against requirements/frozen-identity.json, against the
# effective `forge config` output, and against the compiler recorded in the produced
# artifacts, so editing this file and the frozen fixture together still fails while
# SPEC.md says something else. The full compiler build suffix is separately frozen tool
# identity and must begin with the SPEC.md semantic version. Any drift, including an
# environment override, fails the gate closed.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false

# The required gate is offline: no registry lookup, no compiler download, no git fetch.
# Dependencies and the compiler are materialized before the gate, never by it.
offline = true
ffi = false

# Read-only, and only the committed authorities a test actually reads: the frozen identity,
# the frozen ABI/size surface bin/freeze-artifacts.py generates, the release manifest, and the
# per-contract ABI files. No write access anywhere, and no access to `out/` — a test proves a
# frozen record against compiler truth it can reach in Solidity, never against the build
# directory it would otherwise be restating.
fs_permissions = [
    { access = "read", path = "./requirements" },
    { access = "read", path = "./reports/frozen" },
    { access = "read", path = "./contracts" },
    { access = "read", path = "./abi" },
]

# Deterministic test portfolio. Every seed, run, depth, rejection, revert, and shrink
# setting the required gate uses is committed here rather than left to a default.
[profile.default.fuzz]
runs = 512
seed = "0x5245474e54"
max_test_rejects = 65536
fail_on_revert = true

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = true
max_assume_rejects = 65536
shrink_run_limit = 5000

# The one Base endpoint alias, and the only way this repository ever names a provider. The
# value stays an unresolved environment reference in every committed file and in every piece of
# generated evidence: `bin/gate.sh` reads the *effective* configuration and fails if this alias
# ever resolves there, so a real endpoint cannot reach a report, a log, or a commit. The
# required offline gate never reads it at all.
[rpc_endpoints]
base = "${REGENT_BASE_RPC_URL}"

# The separately authorized read-only Base fork gate. It shares the frozen build, the frozen
# fuzz portfolio, and the frozen dependency closure with the required gate — only the test root,
# the build directory, and the network posture differ, and every one of those differences is
# proved rather than assumed by `bin/fork-gate.sh`. Fork tests live outside the offline test root
# so they can never execute against a hermetic claim, and FFI stays disabled here exactly as it
# is above.
#
# `out`/`cache_path` are deliberately separate. A shared build directory would let fork artifacts
# accumulate in `out/` and change the artifact count the required gate reconciles, so the two
# gates never write to the same place.
#
# `fs_permissions` is read-only here and is not restated: this profile inherits the default list
# above unchanged, which is what makes `check` structurally incapable of writing an observation.
[profile.fork]
test = "test-fork"
out = "out-fork"
cache_path = "cache-fork"
offline = false
ffi = false

# The discovery pass, and the only profile in this repository that may write anything. It is the
# first half of the two-phase fork evidence: it observes chain truth and writes one narrowly
# scoped candidate under `reports/generated/fork/`, which is gitignored scratch. It can reach
# neither `reports/frozen/` nor any committed file, so a discovery run cannot bless its own
# observation into the record the `fork` profile later checks against — installing that record is
# a deliberate, reviewed, human step.
[profile.fork-discovery]
test = "test-fork"
out = "out-fork"
cache_path = "cache-fork"
offline = false
ffi = false
fs_permissions = [
    { access = "read", path = "./requirements" },
    { access = "read", path = "./reports/frozen" },
    { access = "read", path = "./contracts" },
    { access = "read", path = "./abi" },
    { access = "read-write", path = "./reports/generated/fork" },
]
