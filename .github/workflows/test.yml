name: gate

on:
  push:
  pull_request:

# The only check this workflow runs is bin/gate.sh. Every step before it materializes pinned
# material over the network so the gate itself can stay offline and fail closed.
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the frozen toolchain lock
        id: lock
        run: |
          set -eu
          lock() { awk -v key="$1" '$1 == key { print $2 }' requirements/toolchain.lock; }
          {
            printf 'forge=%s\n' "$(lock forge_version | sed 's/-stable$//')"
            printf 'slither=%s\n' "$(lock slither_version)"
            printf 'python=%s\n' "$(lock ledger_python_version)"
            printf 'solc=%s\n' "$(lock solc_identity | cut -d+ -f1)"
          } >>"$GITHUB_OUTPUT"

      - name: Materialize the pinned dependency closure
        run: |
          set -eu
          rewrite='url.https://github.com/.insteadOf=git@github.com:'
          awk '/^[[:space:]]*#/ { next } $1 == "pin" || $1 == "mirror" { print $2 }' \
            requirements/dependency-closure.txt |
            xargs git -c "$rewrite" submodule update --init --
          awk '/^[[:space:]]*#/ { next } $1 == "derived" { print $3, substr($2, length($3) + 2) }' \
            requirements/dependency-closure.txt |
            while read -r parent child; do
              git -C "$parent" -c "$rewrite" submodule update --init -- "$child"
            done

      - name: Materialize the pinned Foundry
        run: |
          set -eu
          curl -L https://foundry.paradigm.xyz | bash
          "$HOME/.foundry/bin/foundryup" --install '${{ steps.lock.outputs.forge }}'
          printf '%s\n' "$HOME/.foundry/bin" >>"$GITHUB_PATH"

      - name: Materialize the pinned Solidity compiler
        run: |
          set -eu
          scratch="$RUNNER_TEMP/solc-materialize"
          mkdir -p "$scratch/src"
          printf '[profile.default]\nsolc = "%s"\n' '${{ steps.lock.outputs.solc }}' >"$scratch/foundry.toml"
          printf '// SPDX-License-Identifier: UNLICENSED\npragma solidity %s;\ncontract M {}\n' \
            '${{ steps.lock.outputs.solc }}' >"$scratch/src/M.sol"
          cd "$scratch" && forge build

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.lock.outputs.python }}

      - name: Materialize the pinned Slither
        run: pip install "slither-analyzer==${{ steps.lock.outputs.slither }}"

      - name: Required gate
        run: bin/gate.sh
