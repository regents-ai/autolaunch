name: gate

on:
  push:
    paths:
      - "contracts/v1/**"
      - "!contracts/v1/README.md"
      - ".gitmodules"
      - ".gitignore"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "contracts/v1/**"
      - "!contracts/v1/README.md"
      - ".gitmodules"
      - ".gitignore"
      - ".github/workflows/test.yml"

# The only check this workflow runs is contracts/v1/bin/gate.sh, from contracts/v1. Every step
# before it materializes pinned material over the network so the gate itself can stay offline
# and fail closed. Every version comes from requirements/frozen-identity.json, never from a
# literal repeated here; Foundry is instead pinned by the digest of the one build whose
# `forge --version` matches that file, which the gate reconciles.
jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/v1
    steps:
      # Full history: the required gate's freezer proves the C4 baseline provenance by reading
      # the capture commit and its parent as Git objects, which a depth-1 checkout lacks.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the frozen identity
        id: frozen
        run: |
          set -eu
          read_frozen() {
            python3 -c "import json;print(json.load(open('requirements/frozen-identity.json'))$1)"
          }
          {
            printf 'slither=%s\n' "$(read_frozen "['toolchain']['slither_version']")"
            printf 'python=%s\n' "$(read_frozen "['toolchain']['python_version']")"
            printf 'solc=%s\n' "$(read_frozen "['build']['solc_version']")"
          } >>"$GITHUB_OUTPUT"

      - name: Materialize the complete recursive dependency closure
        run: |
          set -eu
          # The rewrite is required: one pinned upstream declares an SSH remote for
          # OpenZeppelin, which cannot be fetched here. Recursion is required: the frozen
          # closure includes every nested gitlink, not only the root submodules. The
          # submodules are declared in the top-level .gitmodules and live under this directory.
          git -c url."https://github.com/".insteadOf="git@github.com:" \
              submodule update --init --recursive
          git submodule status --recursive | wc -l

      - name: Materialize the pinned Foundry
        run: |
          set -eu
          # The frozen forge identity is 1.5.1-stable at b0a9dd9ceda36f63e2326ce530c10e6916f4b8a2.
          # Only Foundry's stable-channel build reports that version string (the v1.5.1 build of
          # the same commit reports 1.5.1-v1.5.1). The stable channel moves with each Foundry
          # stable release, so this digest fails closed once it no longer serves that build.
          tarball="$RUNNER_TEMP/foundry.tar.gz"
          curl -fsSL -o "$tarball" \
            https://github.com/foundry-rs/foundry/releases/download/stable/foundry_stable_linux_amd64.tar.gz
          printf '%s  %s\n' 9cb14a30fa95c1af1cbeb035272baec0e85298dc18e6a45ca7236eca5ce95474 "$tarball" |
            sha256sum -c -
          mkdir -p "$HOME/.foundry/bin"
          tar -xzf "$tarball" -C "$HOME/.foundry/bin"
          printf '%s\n' "$HOME/.foundry/bin" >>"$GITHUB_PATH"

      - name: Materialize the pinned Solidity compiler
        run: |
          set -eu
          scratch="$RUNNER_TEMP/solc-materialize"
          mkdir -p "$scratch/src"
          printf '[profile.default]\nsolc = "%s"\n' '${{ steps.frozen.outputs.solc }}' >"$scratch/foundry.toml"
          printf '// SPDX-License-Identifier: UNLICENSED\npragma solidity %s;\ncontract M {}\n' \
            '${{ steps.frozen.outputs.solc }}' >"$scratch/src/M.sol"
          cd "$scratch" && forge build

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.frozen.outputs.python }}

      - name: Materialize the pinned Slither
        run: pip install "slither-analyzer==${{ steps.frozen.outputs.slither }}"

      - name: Required gate
        run: bin/gate.sh
