name: gate

on:
  push:
    paths:
      - "**"
      - "!cli/**"
      - "!platform/**"
      - "!docs/**"
      - "docs/security/**"
      - "docs/audit/**"
      - "!README.md"
      - "!AGENTS.md"
  pull_request:
    paths:
      - "**"
      - "!cli/**"
      - "!platform/**"
      - "!docs/**"
      - "docs/security/**"
      - "docs/audit/**"
      - "!README.md"
      - "!AGENTS.md"

# The only check this workflow runs is bin/gate.sh. Every step before it materializes pinned
# material over the network so the gate itself can stay offline and fail closed. Every
# version comes from requirements/frozen-identity.json, never from a literal repeated here.
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the frozen identity
        id: frozen
        run: |
          set -eu
          read_frozen() {
            python3 -c "import json;print(json.load(open('requirements/frozen-identity.json'))$1)"
          }
          {
            printf 'forge=%s\n' "$(read_frozen "['toolchain']['forge_version']" | sed 's/-stable$//')"
            printf 'slither=%s\n' "$(read_frozen "['toolchain']['slither_version']")"
            printf 'python=%s\n' "$(read_frozen "['toolchain']['python_version']")"
            printf 'solc=%s\n' "$(read_frozen "['build']['solc_version']")"
          } >>"$GITHUB_OUTPUT"

      - name: Materialize the complete recursive dependency closure
        run: |
          set -eu
          # The rewrite is required: one pinned upstream declares an SSH remote for
          # OpenZeppelin, which cannot be fetched here. Recursion is required: the frozen
          # closure includes every nested gitlink, not only the root submodules.
          git -c url."https://github.com/".insteadOf="git@github.com:" \
              submodule update --init --recursive
          git submodule status --recursive | wc -l

      - name: Materialize the pinned Foundry
        run: |
          set -eu
          curl -L https://foundry.paradigm.xyz | bash
          "$HOME/.foundry/bin/foundryup" --install '${{ steps.frozen.outputs.forge }}'
          printf '%s\n' "$HOME/.foundry/bin" >>"$GITHUB_PATH"

      - name: Materialize the pinned Solidity compiler
        run: |
          set -eu
          scratch="$RUNNER_TEMP/solc-materialize"
          mkdir -p "$scratch/src"
          printf '[profile.default]\nsolc = "%s"\n' '${{ steps.frozen.outputs.solc }}' >"$scratch/foundry.toml"
          printf '// SPDX-License-Identifier: UNLICENSED\npragma solidity %s;\ncontract M {}\n' \
            '${{ steps.frozen.outputs.solc }}' >"$scratch/src/M.sol"
          cd "$scratch" && forge build

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.frozen.outputs.python }}

      - name: Materialize the pinned Slither
        run: pip install "slither-analyzer==${{ steps.frozen.outputs.slither }}"

      - name: Required gate
        run: bin/gate.sh
