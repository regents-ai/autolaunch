name: Platform

on:
  push:
    paths:
      - "platform/**"
      - "!platform/*.md"
      - "!platform/docs/**"
      - "blog/**"
      - ".github/workflows/platform.yml"
  pull_request:
    paths:
      - "platform/**"
      - "!platform/*.md"
      - "!platform/docs/**"
      - "blog/**"
      - ".github/workflows/platform.yml"

permissions:
  contents: read

# Shared Regent libraries come from GitHub at the commits platform/mix.lock pins.
# Erlang, Elixir and Node come from platform/.tool-versions.
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    env:
      MIX_ENV: test
    services:
      # config/test.exs connects to 127.0.0.1:5432 as $USER, which is runner here.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: runner
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: platform/.tool-versions
          version-type: strict

      - uses: actions/setup-node@v4
        with:
          node-version-file: platform/.tool-versions

      - run: mix deps.get --check-locked
      - run: npm ci --no-audit --no-fund
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix assets.setup
      - run: mix assets.build
      # After the asset build, which vendors the shared packages' browser modules it imports.
      - run: npx tsc --project assets/tsconfig.json --noEmit
      - run: mix test

  release-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built exactly as a release is, for the production architecture, and never pushed.
      - name: Build the Linux release image
        run: |
          docker build --platform linux/amd64 \
            -f platform/Dockerfile \
            -t autolaunch-release-check \
            .
