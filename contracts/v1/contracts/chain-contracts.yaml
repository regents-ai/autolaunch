# Base chain binding manifest for autolaunch-contracts.
#
# Every value below is a frozen source literal. bin/gate.sh reconciles each binding against
# the SPEC.md binding table by its SPEC.md name, not merely by its literal value, and
# reconciles the same names and values against requirements/frozen-identity.json and
# src/bindings/BaseBindings.sol.
#
# Nothing here is evidence about deployed chain state. Deployed runtime code, code hash,
# proxy status, implementation identity, getter results, the zero protocol fee controller,
# and the live chain id stay bound to the separately authorized fork gate under DEP-040
# through DEP-051. Those runtime values are recorded by C5 when that gate runs; inventing
# them now would be a runtime claim this ticket has no evidence for.
#
# The clone implementation and clone runtime code hashes are a different kind of fact: that
# code is this repository's own. C4 therefore proves them hermetically under DEP-060 against
# the compiled frozen artifacts and the exact Solady 44-byte clone derivation, which is the
# authority a reader can actually recheck from this build. C5 owns the manifest section that
# records those hashes alongside the deployment-specific addresses they end up at, because
# only C5 has the deployment to record.
version: 1
repository: autolaunch-contracts
authority: SPEC.md
chain: base-mainnet
chain_id: 8453
release_posture: local implementation and proof only; mainnet remains NO-GO

bindings:
  - id: regent
    label: REGENT
    constant: REGENT
    address: "0x6f89bcA4eA5931EdFCB09786267b251DeE752b07"
  - id: usdc
    label: USDC
    constant: USDC
    address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
  - id: cca_factory
    label: CCA factory
    constant: CCA_FACTORY
    address: "0x000000001F26a0044BaA66024e7b6599c61963F8"
  - id: pool_manager
    label: PoolManager
    constant: POOL_MANAGER
    address: "0x498581fF718922c3f8e6A244956aF099B2652b2b"
  - id: position_manager
    label: PositionManager
    constant: POSITION_MANAGER
    address: "0x7C5f5A4bBd8fD63184577525326123B519429bDc"
  - id: live_staking
    label: Live staking
    constant: LIVE_STAKING
    address: "0xb027Dc261636E30Cbc0fE25b2F8e1ed273354AB5"
  - id: governance_and_regent_safe
    label: Governance and Regent Safe
    constant: GOVERNANCE_AND_REGENT_SAFE
    address: "0x9fa152B0EAdbFe9A7c5C0a8e1D11784f22669a3e"
  - id: dead_address
    label: Dead address
    constant: DEAD_ADDRESS
    address: "0x000000000000000000000000000000000000dEaD"

admission:
  binding: cca_factory
  stop_rule: any mismatch stops admission
  runtime_code_hash: "0xa1d2a90564f4f63580b25de42efaff92505c254b00fc666f65ab38126cce5cfa"
  signature: "protocolFeeController()"
  selector: "0xf02de3b2"
  state_mutability: view
  returns: IProtocolFeeController
  required_result: zero address
  provenance_repository: https://github.com/Uniswap/continuous-clearing-auction
  provenance_commit: 7d7602d257733315434570f2a0c2f94f1c7b207a
  provenance_path: src/ContinuousClearingAuctionFactory.sol
  provenance_note: taken from the pinned implementation definition, never from an interface file
