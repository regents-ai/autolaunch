[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# Same build identity as the frozen contracts/v1 project: Solidity 0.8.26, Cancun, optimizer 200,
# via-IR, bytecode metadata disabled. The build is offline: dependencies and the compiler are
# materialized before Forge runs (bootstrap-deps.py), never by it.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
offline = true
ffi = false
fs_permissions = []

# `test/fork/` runs only under the `fork` profile against the local Base-fork lab.
no_match_path = "test/fork/**"

[profile.default.fuzz]
runs = 64
seed = "0x53544f434b53"
max_test_rejects = 65536
fail_on_revert = true

[profile.default.invariant]
runs = 16
depth = 32
fail_on_revert = true

# The local Base-fork lab suite. Anvil owns the fork; Forge is only ever pointed at the
# controller-created loopback node (`--fork-url http://127.0.0.1:PORT`).
[profile.fork]
test = "test/fork"
out = "out-fork"
cache_path = "cache-fork"
match_path = "test/fork/**"
# Profiles inherit the default exclusion; a glob that matches nothing lifts it here.
no_match_path = "none/**"

# The deployment-ceremony profile, the only profile `bin/ceremony.py` runs. Same frozen build; a
# separate test root and build directory so ceremony artifacts never touch the set the required gate
# reconciles. No filesystem access: the graph is emitted as decoded logs and rendered by the tool.
[profile.deployment]
test = "test-deployment"
out = "reports/generated/deployment-out"
cache_path = "reports/generated/deployment-cache"
offline = false
ffi = false
fs_permissions = []

# The one Base endpoint alias. Its value stays an unresolved environment reference in every
# committed file; the required offline gate never reads it.
[rpc_endpoints]
base = "${REGENT_BASE_RPC_URL}"

# Lint applies to the shipped sources; test doubles and the lab script are exercised, not linted.
[lint]
ignore = ["test/**/*.sol", "script/**/*.sol"]
exclude_lints = ["screaming-snake-case-immutable", "mixed-case-function", "unwrapped-modifier-logic"]
