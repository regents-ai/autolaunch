[profile.default]
src = "src"
script = "script"
out = "out"
libs = ["lib"]

# Same build identity as the frozen contracts/v1 project: Solidity 0.8.26, Cancun, optimizer 200,
# via-IR, bytecode metadata disabled. The build is offline: dependencies and the compiler are
# materialized before Forge runs (bootstrap-deps.py), never by it.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
offline = true
ffi = false
fs_permissions = []

# The Base endpoint stays an unresolved environment reference in every committed file; the
# required offline gate never reads it.
[rpc_endpoints]
base = "${REGENT_BASE_RPC_URL}"

# Lint applies to the shipped sources, not to the scripts.
[lint]
ignore = ["script/**/*.sol"]
exclude_lints = ["screaming-snake-case-immutable", "mixed-case-function", "unwrapped-modifier-logic"]
