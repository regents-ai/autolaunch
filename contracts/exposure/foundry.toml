[profile.default]
src = "src"
script = "script"
out = "out"
# Exposure builds against the dependency snapshot the Base Memestake v2 package exports
# (contracts/stocks-v2/lib, filled by its bootstrap-deps.py); it uses forge-std and solady only.
libs = ["../stocks-v2/lib"]
allow_paths = ["../stocks-v2"]

# Same build identity as the other Autolaunch contract projects: Solidity 0.8.26, Cancun,
# optimizer 200, via-IR, bytecode metadata disabled.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = []

[lint]
ignore = ["script/**/*.sol"]
# The print schedule and the report deadline are the product, so time comparisons are intended.
exclude_lints = ["screaming-snake-case-immutable", "mixed-case-function", "block-timestamp"]
