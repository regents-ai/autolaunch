[profile.default]
src = "src"
script = "script"
out = "out"
# The Robinhood component builds against the exact dependency snapshot the Stocks component
# exported (contracts/stocks-v2/lib, pinned by contracts/stocks-v2/dependencies.json). It exports nothing
# of its own and never fetches.
libs = ["../stocks-v2/lib"]
allow_paths = ["../stocks-v2"]

# Same build identity as contracts/v1 and contracts/stocks-v2: Solidity 0.8.26, Cancun, optimizer 200,
# via-IR, bytecode metadata disabled, offline.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
offline = true
ffi = false
fs_permissions = []

# The deployment-ceremony profile, the only profile `../stocks-v2/bin/ceremony.py` runs for this
# package. Same frozen build; a separate build directory. The externally linked
# `RobinhoodPositionsLib` is pinned to a fixed address; a real ceremony overrides the pin on the
# command line with its own prediction, and the script proves the link before it creates anything.
[profile.deployment]
out = "reports/generated/deployment-out"
cache_path = "reports/generated/deployment-cache"
offline = false
ffi = false
fs_permissions = []
libraries = ["src/libraries/RobinhoodPositionsLib.sol:RobinhoodPositionsLib:0x968fa82eb9898E7ED76bC36FA44dB539483cd7c6"]

# The endpoint aliases: Robinhood Chain for the launch graph, Base for the receiver. Their values
# stay unresolved environment references in every committed file; the required gate never reads them.
[rpc_endpoints]
robinhood = "${REGENT_ROBINHOOD_RPC_URL}"
base = "${REGENT_BASE_RPC_URL}"

[lint]
ignore = ["script/**/*.sol"]
exclude_lints = ["screaming-snake-case-immutable", "mixed-case-function", "unwrapped-modifier-logic"]
