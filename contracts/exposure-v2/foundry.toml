[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
# Builds against the dependency snapshot the Base Memestake v2 package exports
# (contracts/stocks-v2/lib, filled by its bootstrap-deps.py); it uses forge-std and solady only.
libs = ["../stocks-v2/lib"]
allow_paths = ["../stocks-v2"]

# Same build identity as version 1 and the other Autolaunch contract projects: Solidity 0.8.26,
# Cancun, optimizer 200, via-IR, bytecode metadata disabled.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = []

# `test/fork/` runs only under the `fork` profile against Base (forge --network base, Foundry 1.8.4+).
no_match_path = "test/fork/**"

[profile.default.fuzz]
runs = 1024
seed = "0x4558504f5332"

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false

[profile.fork]
test = "test/fork"
out = "out-fork"
cache_path = "cache-fork"
match_path = "test/fork/**"
no_match_path = "none/**"

[lint]
ignore = ["test/**/*.sol", "script/**/*.sol"]
# block-timestamp: the calendar and the settlement delay are the product, so time comparisons are
#   intended.
# require-revert-in-loop: each loop validates every item (boundaries, days) or guards every round
#   read (the gas floor); one bad item must fail the whole call.
# reentrancy-events: every state-changing function of the series is nonReentrant, and the factory's
#   events follow only view reads of trusted contracts and its own creations.
exclude_lints = [
  "screaming-snake-case-immutable",
  "mixed-case-function",
  "block-timestamp",
  "require-revert-in-loop",
  "reentrancy-events",
]
