app = "autolaunch-sh"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  PHX_HOST = "autolaunch.sh"
  AUTOLAUNCH_DEPLOYMENT_ROLE = "production"
  AUTOLAUNCH_DB_SCHEMA = "autolaunch_app"

[http_service]
  internal_port = 4000
  force_https = true

# BEAM release + migrations OOM at Fly's 256MB default.
[[vm]]
  memory_mb = 1024

[[http_service.checks]]
  grace_period = "30s"
  interval = "10s"
  method = "GET"
  path = "/healthz"
  protocol = "http"
  timeout = "2s"
