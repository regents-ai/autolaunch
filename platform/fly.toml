primary_region = "iad"

# Fly stops a machine with SIGINT unless told otherwise, and the VM answers
# SIGINT by halting at once, cutting open connections and running jobs. SIGTERM
# shuts it down in order: open connections drain and running jobs finish, well
# inside the timeout.
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  PHX_HOST = "autolaunch.sh"
  AUTOLAUNCH_DEPLOYMENT_ROLE = "production"
  AUTOLAUNCH_BASE_DEPLOYMENT = "/app/deployment/base-revstake.json"
  AUTOLAUNCH_BASE_STOCKS_DEPLOYMENT = "/app/deployment/base-memestock.json"
  AUTOLAUNCH_BASE_DEPLOYMENT_ID = "base-mainnet"
  AUTOLAUNCH_ROBINHOOD_DEPLOYMENT = "/app/deployment/robinhood.json"
  AUTOLAUNCH_LAUNCHES_OPEN = "true"
  AUTOLAUNCH_COVERED_CALLS = "true"
  AUTOLAUNCH_BASE_COVERED_CALLS_DEPLOYMENT = "/app/deployment/covered-calls.json"
  AUTOLAUNCH_EXPOSURE = "true"
  AUTOLAUNCH_BASE_EXPOSURE_DEPLOYMENT = "/app/deployment/exposure.json"
  X_OAUTH_CLIENT_ID = "cEh6LVFpQTZTMW5saHhEQ3JzTnE6MTpjaQ"

# The deployment descriptions the contracts ceremony writes. Each carries the
# site's private RPC door, so they are placed on the machine from the
# deployer's disk at `fly deploy` and never enter the image or git.
[[files]]
  guest_path = "/app/deployment/base-revstake.json"
  local_path = "deployment/base-revstake.json"

[[files]]
  guest_path = "/app/deployment/base-memestock.json"
  local_path = "deployment/base-memestock.json"

[[files]]
  guest_path = "/app/deployment/robinhood.json"
  local_path = "deployment/robinhood.json"

# The covered-call markets: contracts/covered-calls/deploy/site-markets.json,
# copied to deployment/covered-calls.json beside the others. It carries no RPC
# door; every read goes through the Base deployment's.
[[files]]
  guest_path = "/app/deployment/covered-calls.json"
  local_path = "deployment/covered-calls.json"

# The Isolated Exposure to After-hours Stocks series:
# contracts/exposure/deployments/base-mainnet/site-series.json, copied to
# deployment/exposure.json beside the others. Every read goes through the Base
# deployment's RPC door.
[[files]]
  guest_path = "/app/deployment/exposure.json"
  local_path = "deployment/exposure.json"

# Fly's managed Prometheus scrapes the site health set over Fly's private
# network. Port 9091 is not a service, so the public proxy never routes to it.
[metrics]
  port = 9091
  path = "/metrics"

# Each deploy first runs the image's migrations on a temporary machine with the
# release login (DATABASE_DIRECT_URL); a failed migration stops the deploy. Then
# the new image starts beside the old one and takes traffic once its /healthz
# check is green, so a release never leaves the site without a running machine.
[deploy]
  release_command = "/app/bin/migrate"
  strategy = "bluegreen"

[http_service]
  internal_port = 4000
  force_https = true

# No hard cap: every visitor reaches the machine. When Sentinel's readings show
# the machine filling up, the answer is a bigger machine, chosen by hand (Sean,
# 14 October 2026). The soft limit only steers new visitors between machines
# when there is more than one.
[http_service.concurrency]
  type = "connections"
  soft_limit = 120

# Keep the production capacity when the next image is deployed. Two dedicated
# processors and 4 GB: measured on 14 October 2026 on the live code, each open
# page, its connection included, adds about 1 MB to the machine, so 2,000 open
# pages use about 2.1 GB. Fly holds a shared processor to
# 6.25% each once its burst is spent, and the site's steady chain reading alone
# uses about that much.
[[vm]]
  size = "performance-2x"
  memory_mb = 4096

[[http_service.checks]]
  grace_period = "30s"
  interval = "10s"
  method = "GET"
  path = "/healthz"
  protocol = "http"
  timeout = "2s"
