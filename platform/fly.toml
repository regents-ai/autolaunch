app = "autolaunch-sh"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  PHX_HOST = "autolaunch.sh"
  AUTOLAUNCH_DEPLOYMENT_ROLE = "production"
  AUTOLAUNCH_BASE_DEPLOYMENT = "/app/deployment/base-revstake.json"
  AUTOLAUNCH_BASE_STOCKS_DEPLOYMENT = "/app/deployment/base-memestock.json"
  AUTOLAUNCH_BASE_DEPLOYMENT_ID = "base-mainnet"
  AUTOLAUNCH_ROBINHOOD_DEPLOYMENT = "/app/deployment/robinhood.json"
  AUTOLAUNCH_LAUNCHES_OPEN = "true"
  X_OAUTH_CLIENT_ID = "cEh6LVFpQTZTMW5saHhEQ3JzTnE6MTpjaQ"

# The deployment descriptions the contracts ceremony writes. Each carries the
# site's private RPC door, so they are placed on the machine from the
# deployer's disk at `fly deploy` and never enter the image or git.
[[files]]
  guest_path = "/app/deployment/base-revstake.json"
  local_path = "deployment/base-revstake.json"

[[files]]
  guest_path = "/app/deployment/base-memestock.json"
  local_path = "deployment/base-memestock.json"

[[files]]
  guest_path = "/app/deployment/robinhood.json"
  local_path = "deployment/robinhood.json"

# Fly's managed Prometheus scrapes the site health set over Fly's private
# network. Port 9091 is not a service, so the public proxy never routes to it.
[metrics]
  port = 9091
  path = "/metrics"

# Start the new image beside the old one and move traffic once its /healthz
# check is green, so a release never leaves the site without a running machine.
[deploy]
  strategy = "bluegreen"

[http_service]
  internal_port = 4000
  force_https = true

# Fly hands the machine no more than this many connections at once, so a crowd
# waits at Fly's edge and the people already on the site keep working. Each
# open page holds one connection for as long as it is open. Measured on
# 13 October 2026: about 270 open pages fill this machine's processor and
# about 300 exhaust its memory, and at 200 its free memory was still falling
# when the reading ended, so 200 was never seen to hold level. Raise it once
# each open page costs less and a longer hold at the new number has been read.
[http_service.concurrency]
  type = "connections"
  hard_limit = 150
  soft_limit = 120

# Keep the production capacity when the next image is deployed. The processor
# is a dedicated one: Fly holds a shared processor to 6.25% each once its burst
# is spent, and the site's steady chain reading alone uses about that much.
[[vm]]
  size = "performance-1x"
  memory_mb = 2048

[[http_service.checks]]
  grace_period = "30s"
  interval = "10s"
  method = "GET"
  path = "/healthz"
  protocol = "http"
  timeout = "2s"
