      - contract_id: subject_splitter_v1
        contract_name: SubjectSplitterV1
        target: stored_subject_splitter_address
        source_commit: 5cf4a6b48388d54593b83230342542fee7c0f131
        source_tree: 33b80348eab6e7ba9bfd4947327a3710981d2092
        abi_path: abi/subject-splitter-v1.json
        abi_sha256: f507fa80395283b722259f6da9dec0ab65b3f33f4b9d5a2a80399593561b3a66
        runtime_keccak256: "0x4ba470d4c443ae5889f5e1f9095e07ed228853604762554437003ed115c56105"
        implementation_provenance: >-
          repos/autolaunch-contracts 5cf4a6b48388d54593b83230342542fee7c0f131
          src/revenue/SubjectSplitterV1.sol defines the four caller-only customer calls at
          lines 189-236, each acting for msg.sender alone with no recipient argument, and the
          reads this lane prepares against at lines 59-80 and 300-302. The ABI file is derived
          from the artifact that pinned build produced, whose metadata keccak256 for that
          source is 0xd411b2c4c69184ea684bfe63d118907c786fdad5a54cb3505488733161c58f4f.
        interface_note: >-
          stake and unstake take only uint256; there is no recipient-argument overload and no
          claimUSDC. claim(address) and claimAll() settle for msg.sender alone and return early
          when nothing is owed, so a canonical success with no Claimed log is a truthful no-op.
          Line 391 divides each post-skim net by staked coverage of the complete 100-billion
          SUBJECT supply declared at line 56 and line 392 leaves the treasury the exact
          remainder, so the whole allocation is derived from totalStaked and the reviewed
          amount. Line 213 refuses any unstake in the caller's own latest stake block; the
          SameBlockUnstake error it reverts with is deliberately not derived, because
          _lastStakeBlock has no getter and no browser behavior consumes it.
        confirmation_event_signatures:
          - Staked(address,uint256)
          - Unstaked(address,uint256)
          - Claimed(address,address,uint256)
        action_ids:
          - stake
          - unstake
          - claim
          - claim_all
