      - contract_id: covered_calls_v2_amznc
        contract_name: CoveredCallsV2
        address: "0xee5B494B7974FeA38Add81a92eA3C794AdB8DDE6"
        source_commit: 755e7ce2cd79c38c55c2a435848b402a67baa5f8
        runtime_code:
          bytes: 7735
          sha256: 2e57d1799c932f83d6ea1b7540fe28684d6a47611568e9b26c6482510b95444a
          keccak256: "0x96528893fe765ba369a54e616f68337d0a4d87689856f19baaca62c9621d51a8"
        onchain_constants:
          stock: "0xb200000000000000000000d9192b6B456483C2E8"
          usdc: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
          staking: "0xb027Dc261636E30Cbc0fE25b2F8e1ed273354AB5"
