        confirmation_event_signatures:
          - LaunchCreated(uint256,address,address,address,address,address,uint64,uint64)
        action_ids:
          - launch
      - contract_id: regent_lbp_strategy_v3
        contract_name: RegentLBPStrategyV3
        target: reviewed_factory_bound_strategy_address
        source_commit: 5b7d7e3e8ce127917f89ffcfbb605c38dfe4a14d
        abi_path: abi/regent-lbp-strategy-v3.json
        abi_sha256: d13690359ed8bfe27c74bef3db2fa2f68422c0f75a767f2be6a8efe5f15eedda
        artifact_provenance: >-
          The consumer ABI is the subset of contracts/revstake-v3/abi/RegentLBPStrategyV3.json this
          site reads, from contracts/revstake-v3/src/strategy/RegentLBPStrategyV3.sol at
          source_commit. It is byte for byte the second strategy's subset.
        interface_note: >-
          The second strategy's reads and treasury refusals, with the schedule restated for
