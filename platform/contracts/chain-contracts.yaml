        reads:
          - id: hook
            signature: hook()
            selector: "0x7f5a7c7b"
          - id: lp_locker
            signature: lpLocker()
            selector: "0x03fc2013"
          - id: floor_price_q96
            signature: FLOOR_PRICE_Q96()
            selector: "0x14ec99b0"
          - id: bid_tick_spacing_q96
            signature: BID_TICK_SPACING_Q96()
            selector: "0xf54c506c"
          - id: required_regent_raised
            signature: REQUIRED_REGENT_RAISED()
            selector: "0xcfc7e1db"
