  - id: stocks_local_lab
    chain_target: base-mainnet
    authority: interface_only
    deployment_status: local_lab_only
    admission: disabled
    source_note: >-
      Autolaunch Stocks versions 2 and 3. The ABIs below are the compiled ABIs of contracts/stocks-v2
      (StocksLaunchpadV2, its StocksFeeHookV1 and StockBidAdapterV1) and of StocksLaunchpadV3 in
      contracts/stocks-v3, whose fee hook and bid adapter ABIs are the second version's. The
      website reads the deployment's ABIs from its stocks site config and validates them against
      the shapes in Autolaunch.Stocks.LabAbi; this entry pins no address.
    admitted_prepared_actions: []
    reviewed_action_evidence:
      - contract_id: stocks_launchpad_v2
        contract_name: StocksLaunchpadV2
        target: stocks_lab_launchpad_address
        abi_path: abi/stocks-launchpad-v2.json
        abi_sha256: b0a52fce7ee21aa013868296234d03a9e91fa00c6d0043acf0991f3c4b7823d8
        interface_note: >-
          launch takes one LaunchParams tuple (name, symbol, description, website, image, stock)
          and nothing else. The floor is the fixed StocksPreset.FLOOR_PRICE_Q96, 4,294,967,300, and
          the required raise is the fixed StocksPreset.REQUIRED_STOCK_RAISED. No launch fee. 0.5% of the
          supply, 5 million tokens (StocksPreset.CREATOR_VESTING), vests to the launcher block by block
          over StocksPreset.CREATOR_VESTING_BLOCKS, 1,296,000 blocks, from graduation
          (releaseCreatorVesting, callable by anyone, pays the launcher). Graduation clones a memestock splitter per launch
          (MemestockSplitterCreated) and locks a full-range position and a new-token-only position
          in the launchpad's locker.
        confirmation_event_signatures:
          - StockLaunchCreated(uint256,address,address,address,address,uint64,uint64,uint256,uint256,uint256)
        reads:
          - id: stock_admission
            signature: stockAdmission(address)
          - id: launches
            signature: launches(uint256)
          - id: launches_paused
            signature: launchesPaused()
          - id: creator_releasable
            signature: creatorReleasable(uint256)
          - id: launch_id_of_token
            signature: launchIdOfToken(address)
          - id: locker
            signature: locker()
          - id: splitter_implementation
            signature: splitterImplementation()
        action_ids:
          - launch
          - release_creator_vesting
      - contract_id: stocks_launchpad_v3
        contract_name: StocksLaunchpadV3
        target: stocks_lab_launchpad_address
        abi_path: abi/stocks-launchpad-v3.json
        abi_sha256: 6f2f17063afeb60d650735c775d177df85da0bdcf0e14b3a917fa86270b7e625
        interface_note: >-
          The second launchpad's interface for Base's 0.2-second blocks; on Base mainnet
          0x1db36b3BD9eC61c54B06a753FeC0b425237D7E7C, deployed and opened on 12 November 2026 with
          its bid adapter 0xa28334dEbaeea58Cd0b12D6814219498293EE1fA
          (contracts/stocks-v3/deployments/base-mainnet/deployed-manifest.json), where new Base
          launches go. The second launchpad, 0x1d4bc582a9193061d53c4BFA429D366Ed38eEd0B, is
          paused; its launches keep their own launchpad, hook, locker and bid adapter. Bidding opens
          StocksPreset.START_LEAD_BLOCKS, 3,000 blocks, after the creation block and runs
          AUCTION_DURATION_BLOCKS, 431,991 blocks; claims open 640 and the pool 1,280 blocks after
          the end. The creator's 5 million tokens vest by the clock over
          StocksPreset.CREATOR_VESTING_SECONDS, 30 days, from the graduation timestamp the launch
          record holds as vestingStart (releaseCreatorVesting, callable by anyone, pays the
          launcher).
        confirmation_event_signatures:
          - StockLaunchCreated(uint256,address,address,address,address,uint64,uint64,uint256,uint256,uint256)
        reads:
          - id: stock_admission
            signature: stockAdmission(address)
          - id: launches
            signature: launches(uint256)
          - id: launches_paused
            signature: launchesPaused()
          - id: creator_releasable
            signature: creatorReleasable(uint256)
          - id: launch_id_of_token
            signature: launchIdOfToken(address)
          - id: locker
            signature: locker()
          - id: splitter_implementation
            signature: splitterImplementation()
        action_ids:
          - launch
          - release_creator_vesting
      - contract_id: stocks_bid_adapter_v2
        contract_name: StockBidAdapterV1
        target: stocks_lab_bid_adapter_address
        abi_path: abi/stocks-bid-adapter-v2.json
        abi_sha256: 24d60b5fc2d1132e983c98d0ecefaa6e5c1c69021770ab4c374b17a0abb395ad
        interface_note: >-
          bidWithUsdc(auction, usdcAmount, minStockOut, maxPriceQ96, prevTickPriceQ96, deadline)
          pulls exactly usdcAmount through a standard ERC-20 allowance to the adapter and bids as
          owner = msg.sender. The only USDC allowance a bid prepares is that exact amount.
        confirmation_event_signatures:
          - StockBidPlaced(address,address,uint256,uint256,uint128,uint256)
        action_ids:
          - bid_with_usdc
      - contract_id: stock_route
        contract_name: IStockRoute
        target: launchpad_admitted_route_for_stock
        abi_path: abi/stock-route.json
        abi_sha256: 461b1c0990927cfee560b71700d60c15dd700c8d5551c3904e52f741e5de260f
        interface_note: quoteExactIn is a read-only estimate for review copy and never binding.
        reads:
          - id: quote_exact_in
            signature: quoteExactIn(address,address,uint256)
        action_ids: []
      - contract_id: stocks_fee_hook_v2
        contract_name: StocksFeeHookV1
        target: stocks_lab_hook_address
