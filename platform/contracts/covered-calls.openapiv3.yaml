# Covered calls, added to api-contract.openapiv3.yaml only while the site offers them
# (AUTOLAUNCH_COVERED_CALLS=true; AutolaunchWeb.PublicDocuments.openapi/0). Off, /openapi.json
# is api-contract.openapiv3.yaml exactly. Every path and component here is new; none replaces one.
paths:
  /api/v1/covered-calls/{symbol}:
    get:
      operationId: getCoveredCallBook
      summary: Read a stock's covered calls
      description: The covered calls offered on one Base stock token as its contract holds them at the
        latest block. The open listings with what is left to buy, the best for a buyer first, and the open
        bids with what is left to sell into each, the best for a seller first; at most fifty of each, with
        the count of all that are open (`listings_total`, `bids_total`); the stock's multiplier and its
        reference price. Stock amounts are raw token units
        (`unit` is one whole token), prices micro-USDC per whole token, times Unix seconds. The reading is shared and may be up to five minutes old (`read_at`).
        Needs no account; the page tool autolaunch_covered_call_listings calls it.
      security: []
      parameters:
      - $ref: '#/components/parameters/CoveredCallSymbol'
      responses:
        '200':
          description: The stock's covered-call book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallBookEnvelope'
        '404':
          description: No covered-call market for that stock (unknown_market)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallError'
        '422':
          description: A query parameter was sent (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallError'
        '503':
          description: The chain could not be read (chain_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/OtherError'
  /api/v1/covered-calls/{symbol}/quote:
    post:
      operationId: quoteCoveredCall
      summary: Suggest a covered-call premium
      description: A seller's quote for a call expiring at `expiry`, from the stock's reference price, as a
        guide before listing. It gives the reference price, the next four weekly expiries a listing may take
        (Fridays when the US stock market is shut or closes early are left out) with their exercise
        windows, three suggested strikes above the reference price with a suggested premium for each, and,
        for the chosen strike (the middle suggestion when `strike_per_token` is left out) and premium (the
        suggestion when `premium_per_token` is left out), what a listing of `amount` pays if all of it is
        bought at once and all of it exercised. Every USDC figure is what the contract counts, rounded up.
        Without `amount` the per-token figures still come back and the totals are null. The contract enforces
        no suggestion. Refused while the reference price is more than four days old. Needs no account; the
        page tool autolaunch_covered_call_quote calls it.
      security: []
      parameters:
      - $ref: '#/components/parameters/CoveredCallSymbol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoveredCallQuoteRequest'
      responses:
        '200':
          description: The quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallQuoteEnvelope'
        '404':
          description: No covered-call market for that stock (unknown_market)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallError'
        '422':
          description: The expiry has passed or is not one of the four a quote offers, or the body leaves out
            the expiry, names another field, or gives a field that is not a whole number in range
            (expiry_not_offered, expiry_passed, invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallError'
        '503':
          description: The reference price or the chain could not be read (price_unavailable, chain_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/OtherError'
  /api/v1/me/covered-calls/{symbol}:
    get:
      operationId: listMyCoveredCalls
      summary: List your covered calls on a stock
      description: The listings the signed-in wallet sold on one Base stock token, on every listing the
        calls it may exercise and the stock it may claim, and the bids it made with what a refund would
        send it now, read now at the latest block. A sale into a bid opens a listing like any other, so it
        is the seller's sold listing and the bidder's held calls. Only the wallet
        the person signed in with is read. Needs the site's sign-in in the same browser.
      security:
      - SiteSession: []
      parameters:
      - $ref: '#/components/parameters/CoveredCallSymbol'
      responses:
        '200':
          description: The signed-in wallet's covered calls
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallPositionsEnvelope'
        '401':
          description: Nobody is signed in on this site in this browser (authentication_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallError'
        '404':
          description: No covered-call market for that stock (unknown_market)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallError'
        '409':
          description: The account has no wallet to read (wallet_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallError'
        '503':
          description: The chain could not be read (chain_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/OtherError'
  /api/agent/v1/covered-calls/{symbol}/positions:
    get:
      operationId: autolaunch_my_covered_calls
      summary: Read my covered calls on a stock
      description: The covered calls of the paired agent's person on one Base stock token, for the wallet
        they signed in with, read now at the latest block. Changes nothing.
      security:
      - SiwaProof: []
      parameters:
      - $ref: '#/components/parameters/CoveredCallSymbol'
      responses:
        '200':
          description: The person's covered calls
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallPositionsEnvelope'
        '401':
          description: Fresh request proof required
        '403':
          description: The agent is paired with nobody (agent_not_paired); the error's hint says what
            the person does next
        '404':
          description: No covered-call market for that stock (unknown_market)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallError'
        '409':
          description: The person's account has no wallet to read (wallet_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallError'
        '503':
          description: The chain could not be read (chain_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallError'
  /api/agent/v1/covered-calls/{symbol}/steps:
    post:
      operationId: autolaunch_covered_call_prepare
      summary: Prepare a covered-call step
      description: The wallet steps for one covered-call action, built from the chain at the latest block,
        for one of the person's own wallets (`signer`, or the wallet they signed in with). The site only
        prepares; the wallet's own key signs and sends each step. An action the chain's current state
        makes certain to fail answers 200 with `blocked`, and its steps. Changes nothing.
      security:
      - SiwaProof: []
      parameters:
      - $ref: '#/components/parameters/CoveredCallSymbol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoveredCallStepRequest'
      responses:
        '200':
          description: The steps, whether the allowance already covers them, and any reason they are certain
            to fail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallStepsEnvelope'
        '401':
          description: Fresh request proof required
        '403':
          description: The agent is paired with nobody (agent_not_paired), or the signer is not one of
            the person's own wallets (wrong_signer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallError'
        '404':
          description: No such market, listing or bid (unknown_market, unknown_listing, unknown_bid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallError'
        '409':
          description: The person's account has no wallet to act with (wallet_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallError'
        '422':
          description: An unknown field, kind or type, an amount below one, or a list or bid expiry that has
            passed or is not one of the four a quote offers (invalid_request, invalid_amount,
            expiry_not_offered, expiry_passed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoveredCallError'
        '503':
          description: The chain could not be read, or the site is not open yet (chain_unavailable, prelaunch_read_only)
components:
  parameters:
    CoveredCallSymbol:
      name: symbol
      in: path
      required: true
      description: The stock token's symbol exactly as the site lists it, such as AMZNc.
      schema:
        type: string
  schemas:
    CoveredCallMarket:
      type: object
      additionalProperties: false
      description: The stock the calls are on, named by its issuer, its chain and its exact addresses.
      required:
      - symbol
      - issuer
      - chain
      - chain_id
      - stock
      - contract
      properties:
        symbol:
          type: string
          description: The stock token's symbol as the site lists it, such as AMZNc.
        issuer:
          type: string
          description: Who issues the stock token, such as Coinbase. The issuer can pause or seize it.
        chain:
          type: string
          description: The chain's name, such as Base.
        chain_id:
          type: integer
        stock:
          type: string
          description: The stock token's address on that chain.
        contract:
          type: string
          description: The market's covered-calls contract on that chain.
    CoveredCallListing:
      type: object
      additionalProperties: false
      required:
      - id
      - seller
      - expiry
      - amount
      - filled
      - exercised
      - strike_per_token
      - premium_per_token
      - stock_returned
      - stage
      - available
      - exercise_closes_at
      - strike_due
      properties:
        id:
          type: integer
          description: The listing's number on this market.
        seller:
          type: string
          description: The wallet that made the listing.
        expiry:
          type: integer
          description: 'Unix seconds: a Friday at 21:00 UTC. Buying closes then.'
        exercise_closes_at:
          type: integer
          description: Unix seconds; the exercise window is the 24 hours from expiry.
        amount:
          type: integer
          description: Raw stock units listed.
        filled:
          type: integer
          description: Raw stock units bought.
        available:
          type: integer
          description: Raw stock units still for sale.
        exercised:
          type: integer
          description: Raw stock units exercised.
        strike_per_token:
          type: integer
          description: Micro-USDC per whole token.
        premium_per_token:
          type: integer
          description: Micro-USDC per whole token.
        strike_due:
          type: integer
          description: Strike micro-USDC paid and not yet collected by the seller.
        stock_returned:
          type: boolean
          description: Whether the unexercised stock has been booked back to the seller.
        stage:
          type: string
          enum:
          - open
          - sold
          - exercise
          - closed
          - stopped
          description: 'open: for sale; sold: nothing left before expiry; exercise: the 24 hours after
            expiry; closed: after them; stopped: its seller stopped it before any was bought.'
    CoveredCallBid:
      type: object
      additionalProperties: false
      required:
      - id
      - bidder
      - expiry
      - amount
      - filled
      - available
      - strike_per_token
      - premium_per_token
      - min_sale
      - stage
      properties:
        id:
          type: integer
          description: The bid's number on this market.
        bidder:
          type: string
          description: The wallet that made the bid; the calls sold into it are its.
        expiry:
          type: integer
          description: 'Unix seconds: a Friday at 21:00 UTC. Sales into the bid close then.'
        amount:
          type: integer
          description: Raw stock units the bid asks for in all; lowered to filled when the bid is cancelled
            or refunded after expiry.
        filled:
          type: integer
          description: Raw stock units sold into the bid.
        available:
          type: integer
          description: Raw stock units still asked for.
        strike_per_token:
          type: integer
          description: Micro-USDC per whole token.
        premium_per_token:
          type: integer
          description: Micro-USDC per whole token, paid from the bid's escrow to each seller at once.
        min_sale:
          type: integer
          description: The fewest raw stock units one sale into the bid may be, unless it sells all that
            is left.
        stage:
          type: string
          enum:
          - open
          - sold
          - cancelled
          - expired
          description: 'open: stock can be sold into it; sold: nothing left to sell into it (also a bid
            cancelled after a sale); cancelled: stopped before any sale; expired: its expiry passed with
            part unsold.'
    CoveredCallOwnBid:
      type: object
      additionalProperties: false
      required:
      - id
      - bidder
      - expiry
      - amount
      - filled
      - available
      - strike_per_token
      - premium_per_token
      - min_sale
      - stage
      - refundable
      properties:
        id:
          type: integer
          description: The bid's number on this market.
        bidder:
          type: string
          description: The wallet that made the bid; the calls sold into it are its.
        expiry:
          type: integer
          description: 'Unix seconds: a Friday at 21:00 UTC. Sales into the bid close then.'
        amount:
          type: integer
          description: Raw stock units the bid asks for in all; lowered to filled when the bid is cancelled
            or refunded after expiry.
        filled:
          type: integer
          description: Raw stock units sold into the bid.
        available:
          type: integer
          description: Raw stock units still asked for.
        strike_per_token:
          type: integer
          description: Micro-USDC per whole token.
        premium_per_token:
          type: integer
          description: Micro-USDC per whole token, paid from the bid's escrow to each seller at once.
        min_sale:
          type: integer
          description: The fewest raw stock units one sale into the bid may be, unless it sells all that
            is left.
        stage:
          type: string
          enum:
          - open
          - sold
          - cancelled
          - expired
          description: 'open: stock can be sold into it; sold: nothing left to sell into it (also a bid
            cancelled after a sale); cancelled: stopped before any sale; expired: its expiry passed with
            part unsold.'
        refundable:
          type: integer
          description: Micro-USDC a refund would send the bidder now; after expiry it includes the escrow
            of the part never sold.
    CoveredCallBookEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - symbol
          - market
          - block
          - now
          - read_at
          - unit
          - multiplier
          - multiplier_change_at
          - reference_price
          - listings
          - listings_total
          - bids
          - bids_total
          properties:
            symbol:
              type: string
            market:
              $ref: '#/components/schemas/CoveredCallMarket'
            block:
              type: integer
            now:
              type: integer
              description: The block's time, Unix seconds.
            read_at:
              type: string
              format: date-time
            unit:
              type: integer
              description: Raw units in one whole token.
            multiplier:
              type: integer
              description: Shares per token, scaled by 10^18.
            multiplier_change_at:
              type: integer
              description: Unix seconds of a scheduled multiplier change, or 0 when none is scheduled.
            reference_price:
              description: The stock's reference price, or null when the feed does not answer.
              oneOf:
              - type: 'null'
              - type: object
                additionalProperties: false
                required:
                - answer
                - decimals
                - updated_at
                properties:
                  answer:
                    type: integer
                  decimals:
                    type: integer
                  updated_at:
                    type: integer
            listings:
              type: array
              maxItems: 50
              description: The open listings, the best for a buyer first, which is the soonest expiry, then the
                lowest strike plus premium, then the oldest. At most fifty.
              items:
                $ref: '#/components/schemas/CoveredCallListing'
            listings_total:
              type: integer
              description: How many listings are open in all.
            bids:
              type: array
              maxItems: 50
              description: The open bids with at least one whole token left, the best for a seller first, which
                is the soonest expiry, then the most a seller ends with per token at the reference price (the
                premium plus the strike, the strike counted no higher than that price), then the highest
                premium, the highest strike and the oldest. At most fifty.
              items:
                $ref: '#/components/schemas/CoveredCallBid'
            bids_total:
              type: integer
              description: How many such bids are open in all.
    CoveredCallQuoteRequest:
      type: object
      additionalProperties: false
      required:
      - expiry
      properties:
        expiry:
          type: integer
          description: One of the next four Fridays at 21:00 UTC a quote offers, Unix seconds; Fridays when
            the US stock market is shut or closes early are left out.
        amount:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Raw stock units to list. Left out, the totals are null.
        strike_per_token:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Micro-USDC per whole token. Left out, the middle suggested strike.
        premium_per_token:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Micro-USDC per whole token the listing asks. Left out, the suggested premium.
    CoveredCallExpiry:
      type: object
      additionalProperties: false
      required:
      - expiry
      - exercise_opens_at
      - exercise_closes_at
      properties:
        expiry:
          type: integer
          description: A Friday at 21:00 UTC, Unix seconds.
        exercise_opens_at:
          type: integer
          description: When its calls may first be exercised, Unix seconds (the expiry).
        exercise_closes_at:
          type: integer
          description: When its exercise window closes, Unix seconds (24 hours after the expiry).
    CoveredCallPreset:
      type: object
      additionalProperties: false
      required:
      - strike_per_token
      - above_reference
      - suggested_premium_per_token
      - premium
      properties:
        strike_per_token:
          type: integer
          description: Micro-USDC per whole token, rounded up to the stock's price step.
        above_reference:
          type: number
          description: How far the strike is above the reference price, as a fraction (0.02 is 2%).
        suggested_premium_per_token:
          type: integer
          description: Micro-USDC per whole token, to the cent.
        premium:
          type:
          - integer
          - 'null'
          description: The suggested premium for `amount`, in micro-USDC, rounded up as the contract counts
            it; null without an amount.
    CoveredCallReceipt:
      type: object
      additionalProperties: false
      required:
      - reference_value
      - premium
      - fee
      - net_premium
      - strike
      - net_premium_yield
      properties:
        reference_value:
          type: integer
          description: The stock's worth at the reference price, in micro-USDC.
        premium:
          type: integer
          description: The premium in micro-USDC if all of it is bought at once.
        fee:
          type: integer
          description: The 1% of that premium that goes to REGENT staking, rounded up, in micro-USDC.
        net_premium:
          type: integer
          description: What the seller keeps of that premium, in micro-USDC.
        strike:
          type: integer
          description: The strike in micro-USDC the seller collects if all of it is exercised.
        net_premium_yield:
          type: number
          description: net_premium as a fraction of reference_value, for the term to expiry (not a yearly
            rate).
    CoveredCallQuoteEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - symbol
          - market
          - unit
          - spot_per_token
          - price_updated_at
          - volatility
          - expiries
          - presets
          - expiry
          - exercise_closes_at
          - term_days
          - amount
          - strike_per_token
          - suggested_premium_per_token
          - premium_per_token
          - receipt
          properties:
            symbol:
              type: string
            market:
              $ref: '#/components/schemas/CoveredCallMarket'
            unit:
              type: integer
              description: Raw units in one whole token.
            spot_per_token:
              type: integer
              description: The reference price in micro-USDC per whole token.
            price_updated_at:
              type: integer
              description: When the reference price was last updated, Unix seconds.
            volatility:
              type: number
              description: The yearly volatility the suggestion assumes.
            expiries:
              type: array
              description: The next four weekly expiries a listing may take, leaving out Fridays when the
                US stock market is shut or closes early.
              items:
                $ref: '#/components/schemas/CoveredCallExpiry'
            presets:
              type: array
              description: Three suggested strikes, ascending, each above the reference price.
              items:
                $ref: '#/components/schemas/CoveredCallPreset'
            expiry:
              type: integer
            exercise_closes_at:
              type: integer
              description: When the chosen expiry's exercise window closes, Unix seconds.
            term_days:
              type: integer
              description: Whole days from now to the chosen expiry, to the nearest day and at least
                one; the term net_premium_yield is for.
            amount:
              type:
              - integer
              - 'null'
              description: The raw stock units asked about, or null.
            strike_per_token:
              type: integer
              description: The chosen strike, micro-USDC per whole token.
            suggested_premium_per_token:
              type: integer
              description: The suggested premium at the chosen strike, micro-USDC per whole token, to the cent.
            premium_per_token:
              type: integer
              description: The premium the receipt counts, micro-USDC per whole token.
            receipt:
              description: What the listing pays, or null without an amount.
              oneOf:
              - type: 'null'
              - $ref: '#/components/schemas/CoveredCallReceipt'
    CoveredCallPositionsEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - symbol
          - market
          - wallet
          - now
          - read_at
          - unit
          - sold
          - holdings
          - bids
          - balance
          properties:
            symbol:
              type: string
            market:
              $ref: '#/components/schemas/CoveredCallMarket'
            wallet:
              type: string
            now:
              type: integer
            read_at:
              type: string
              format: date-time
            unit:
              type: integer
            sold:
              type: array
              items:
                $ref: '#/components/schemas/CoveredCallListing'
            holdings:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - listing_id
                - held
                - claimable
                - strike_per_token
                - expiry
                - exercise_closes_at
                - stage
                properties:
                  listing_id:
                    type: integer
                  held:
                    type: integer
                    description: Raw stock units of calls the wallet holds. They can be exercised
                      only from expiry until exercise_closes_at; after that they have ended and the
                      premium is not returned.
                  claimable:
                    type: integer
                    description: Raw stock units the wallet may claim now.
                  strike_per_token:
                    type: integer
                    description: Micro-USDC per whole token the holder pays to exercise.
                  expiry:
                    type: integer
                    description: 'Unix seconds: when the exercise window opens, a Friday at 21:00 UTC.'
                  exercise_closes_at:
                    type: integer
                    description: Unix seconds; exercise is refused from this moment on.
                  stage:
                    type: string
                    enum:
                    - open
                    - sold
                    - exercise
                    - closed
                    - stopped
                    description: The listing's stage, as in the book.
            bids:
              type: array
              description: Every bid the wallet made, oldest first.
              items:
                $ref: '#/components/schemas/CoveredCallOwnBid'
            balance:
              type: integer
              description: Raw stock units in the wallet itself, the most it can list now; stock already
                listed is held by the contract.
    CoveredCallStepRequest:
      type: object
      additionalProperties: false
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - list
          - fill
          - cancel
          - exercise
          - claim
          - collect_strike
          - bid
          - raise_bid
          - cancel_bid
          - refund_bid
          - sell_to_bid
        listing_id:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: 'For fill, cancel, exercise, claim and collect_strike: the listing''s number.'
        bid_id:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: 'For raise_bid, cancel_bid, refund_bid and sell_to_bid: the bid''s number.'
        amount:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        strike_per_token:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        premium_per_token:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        expiry:
          type: integer
          description: 'For list and bid: one of the next four Fridays at 21:00 UTC a quote offers, Unix
            seconds; Fridays when the US stock market is shut or closes early are left out.'
        signer:
          type: string
          description: One of the person's own wallet addresses; omit it for the wallet they signed in
            with.
    CoveredCallStepsEnvelope:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - kind
          - signer
          - market
          - chain
          - steps
          - approved
          - blocked
          - facts
          properties:
            kind:
              type: string
              enum:
              - list
              - fill
              - cancel
              - exercise
              - claim
              - collect_strike
              - bid
              - raise_bid
              - cancel_bid
              - refund_bid
              - sell_to_bid
            signer:
              type: string
              description: The wallet the steps are for.
            market:
              $ref: '#/components/schemas/CoveredCallMarket'
            chain:
              type: object
              required:
              - chain_id
              - name
              - rpc_url
              properties:
                chain_id:
                  type: integer
                name:
                  type: string
                rpc_url:
                  type: string
            steps:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - kind
                - step
                - to
                - data
                - value
                properties:
                  kind:
                    type: string
                    enum:
                    - transaction
                  step:
                    type: string
                    enum:
                    - stock_approval
                    - usdc_approval
                    - list
                    - fill
                    - cancel
                    - exercise
                    - claim
                    - collect_strike
                    - bid
                    - raise_bid
                    - cancel_bid
                    - refund_bid
                    - sell_to_bid
                  to:
                    type: string
                  data:
                    type: string
                  value:
                    type: string
                    description: Hex wei; always 0x0.
            approved:
              type: boolean
              description: Whether the allowance already covers the action; always true for actions with
                no approval.
            blocked:
              description: Null, or why the chain's current state makes the action certain to fail.
              oneOf:
              - type: 'null'
              - type: object
                additionalProperties: false
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    enum:
                    - corporate_action
                    - not_enough_stock
                    - approve_first
                    - fills_closed
                    - sold_out
                    - not_enough_usdc
                    - exercise_not_open
                    - exercise_closed
                    - more_than_held
                    - not_seller
                    - nothing_to_cancel
                    - nothing_to_claim
                    - nothing_to_collect
                    - not_bidder
                    - bid_expired
                    - more_than_bid
                    - below_minimum_sale
                    - nothing_to_refund
                  message:
                    type: string
            facts:
              type: object
              description: 'The action''s figures, in raw stock units and micro-USDC: listing_id or bid_id,
                amount, and the premium, fee, strike or unsold amount it involves. A purchase also gives
                the strike its calls would cost to exercise and the expiry their window opens at. A bid
                gives its min_sale and the escrow it takes; a raise the escrow it adds; a cancel of a bid
                the escrow it releases (released) to refund; a sale into a bid its premium, the fee, what
                lands in the seller''s wallet (receive) and the strike.'
    CoveredCallError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - hint
          properties:
            code:
              type: string
              enum:
              - unknown_market
              - unknown_listing
              - unknown_bid
              - invalid_amount
              - expiry_not_offered
              - expiry_passed
              - invalid_request
              - wrong_signer
              - wallet_required
              - authentication_required
              - price_unavailable
              - chain_unavailable
              - agent_not_paired
            message:
              type: string
            hint:
              type: string
              description: What to do next.
