# Isolated Exposure to After-hours Stocks, added to api-contract.openapiv3.yaml only while the site offers it
# (AUTOLAUNCH_EXPOSURE=true; AutolaunchWeb.PublicDocuments.openapi/0). Off, /openapi.json
# is api-contract.openapiv3.yaml exactly. Every path and component here is new; none replaces one.
paths:
  /api/v1/after-hour-stocks:
    get:
      operationId: listExposureWeeks
      summary: List Isolated Exposure to After-hours Stocks weeks
      description: This week and the last eight weeks that opened, newest first, as each stands at the latest
        block on Base. Each week splits one stock token for one trading week into an After-hours token (the
        stock's moves from each close to the next open) and a Market-hours token (its moves from each open
        to the close). A week opens with its first deposit; until then it is listed with the address it will
        open at and the terms it would open with. Stock and token amounts are raw token units, prices and
        ledger values WAD dollars per stock token, pool quotes micro-USDC, times Unix seconds. Needs no
        account; the page tool autolaunch_after_hour_stocks_list calls it.
      security: []
      responses:
        '200':
          description: The factory, this week and the recent weeks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureWeekListEnvelope'
        '422':
          description: A query parameter was sent (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureError'
        '503':
          description: The chain could not be read (chain_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/OtherError'
  /api/v1/after-hour-stocks/{week}:
    get:
      operationId: getExposureWeek
      summary: Read an Isolated Exposure to After-hours Stocks week
      description: One week at the latest block, in the shape of each week of listExposureWeeks, with every
        price its series has applied. Needs no account; the page tool autolaunch_after_hour_stocks_week
        calls it.
      security: []
      parameters:
      - $ref: '#/components/parameters/ExposureWeek'
      responses:
        '200':
          description: The week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureWeekEnvelope'
        '404':
          description: Neither this week nor one that has opened (unknown_week)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureError'
        '422':
          description: The week is not a number, or a query parameter was sent (invalid_request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureError'
        '503':
          description: The chain could not be read (chain_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/OtherError'
  /api/v1/me/after-hour-stocks/{week}:
    get:
      operationId: getMyExposure
      summary: Read your Isolated Exposure to After-hours Stocks holding
      description: What the signed-in wallet holds of one week and what it can redeem now, read at the
        latest block; before the week opens, its stock and USDC alone. Only the wallet the person
        signed in with is read. Needs the site's sign-in in the same browser.
      security:
      - SiteSession: []
      parameters:
      - $ref: '#/components/parameters/ExposureWeek'
      responses:
        '200':
          description: The signed-in wallet's holding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureHoldingsEnvelope'
        '401':
          description: Nobody is signed in on this site in this browser (authentication_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureError'
        '404':
          description: Neither this week nor one that has opened (unknown_week)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureError'
        '409':
          description: The account has no wallet to read (wallet_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureError'
        '503':
          description: The chain could not be read (chain_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/OtherError'
  /api/agent/v1/after-hour-stocks/{week}/holdings:
    get:
      operationId: autolaunch_my_after_hour_stocks
      summary: Read your person's Isolated Exposure to After-hours Stocks holding
      description: What the paired person's signed-in wallet holds of one week and what it can redeem now,
        read at the latest block. Changes nothing.
      security:
      - SiwaProof: []
      parameters:
      - $ref: '#/components/parameters/ExposureWeek'
      responses:
        '200':
          description: The person's holding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureHoldingsEnvelope'
        '401':
          description: Fresh request proof required
        '403':
          description: The agent is paired with nobody (agent_not_paired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureError'
        '404':
          description: Neither this week nor one that has opened (unknown_week)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureError'
        '409':
          description: The person's account has no wallet to read (wallet_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureError'
        '503':
          description: The chain could not be read (chain_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureError'
  /api/agent/v1/after-hour-stocks/{week}/steps:
    post:
      operationId: autolaunch_after_hour_stocks_prepare
      summary: Prepare an Isolated Exposure to After-hours Stocks step
      description: The wallet steps for one action on one week, built from the chain at the latest block,
        for one of the person's own wallets (`signer`, or the wallet they signed in with). The site only
        prepares; the wallet's own key signs and sends each step. An action the chain's current state makes
        certain to fail answers 200 with `blocked`, and its steps. Changes nothing.
      security:
      - SiwaProof: []
      parameters:
      - $ref: '#/components/parameters/ExposureWeek'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExposureStepRequest'
      responses:
        '200':
          description: The steps, whether the allowance already covers them, and any reason they are certain
            to fail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureStepsEnvelope'
        '401':
          description: Fresh request proof required
        '403':
          description: The agent is paired with nobody (agent_not_paired), or the signer is not one of
            the person's own wallets (wrong_signer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureError'
        '404':
          description: Neither this week nor one that has opened (unknown_week)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureError'
        '409':
          description: The person's account has no wallet to act with (wallet_required), or the action needs
            the week's tokens and the week has not opened yet (week_not_open)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureError'
        '422':
          description: An unknown field, kind or type, a missing token, or amounts that come to nothing
            (invalid_request, leg_required, invalid_amount)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureError'
        '503':
          description: The chain could not be read, or the site is not open yet (chain_unavailable, prelaunch_read_only)
components:
  parameters:
    ExposureWeek:
      name: week
      in: path
      required: true
      description: The factory's week number, as listExposureWeeks gives it. Week w runs from the Monday
        7w - 3 to the Sunday 7w + 3, in days since 1970-01-01.
      schema:
        type: integer
        minimum: 1
  schemas:
    ExposureToken:
      type: object
      required:
      - address
      - symbol
      - name
      - decimals
      properties:
        address:
          type: string
        symbol:
          type: string
        name:
          type: string
        decimals:
          type: integer
    ExposureLeg:
      type: object
      required:
      - address
      - symbol
      - name
      - decimals
      - ledger
      - supply
      - pool
      properties:
        address:
          description: Null until the week opens; the token is made by the week's first deposit.
          type:
          - string
          - 'null'
        symbol:
          type: string
        name:
          type: string
        decimals:
          type: integer
        ledger:
          type: integer
          description: What one token is worth now in its share of the stock, WAD dollars per stock token.
        supply:
          type: integer
          description: Raw units in existence.
        pool:
          description: Null without an Aerodrome pool against USDC; otherwise the pool and what one whole
            token sells for there now (null when it holds nothing to quote).
          oneOf:
          - type: 'null'
          - type: object
            required:
            - address
            - usdc_per_token
            properties:
              address:
                type: string
              usdc_per_token:
                type:
                - integer
                - 'null'
    ExposureMoment:
      type: object
      required:
      - index
      - at
      - kind
      - applies_at
      properties:
        index:
          type: integer
        at:
          type: integer
          description: The open or close, Unix seconds.
        kind:
          type: string
          enum:
          - open
          - close
        applies_at:
          type: integer
          description: From when the series applies this price, an hour after it.
    ExposureWeek:
      type: object
      required:
      - week
      - current
      - opened
      - series
      - factory
      - block
      - now
      - read_at
      - stock
      - after_hours
      - market_hours
      - feed
      - feed_phase
      - terms_hash
      - terms_url
      - status
      - end_reason
      - price
      - deposit_cap
      - deposited
      - held
      - opening_paused
      - prices_applied
      - prices_waiting
      - feed_unreadable
      - feed_unreadable_since
      - schedule
      - next
      properties:
        week:
          type: integer
        current:
          type: boolean
          description: Whether this is the week that takes deposits now.
        opened:
          type: boolean
          description: Whether the week's first deposit has opened its series.
        series:
          type: string
          description: The week's series contract; before the week opens, the address it will open at.
        factory:
          type: string
        block:
          type: integer
        now:
          type: integer
          description: The block's time, Unix seconds.
        read_at:
          type: string
          format: date-time
        stock:
          $ref: '#/components/schemas/ExposureToken'
        after_hours:
          $ref: '#/components/schemas/ExposureLeg'
        market_hours:
          $ref: '#/components/schemas/ExposureLeg'
        feed:
          type: string
          description: The Chainlink price feed proxy the series reads.
        feed_phase:
          type: integer
          description: The version of the feed the series reads, fixed when it opens.
        terms_hash:
          type: string
          description: keccak256 of the exact bytes of the week's terms.
        terms_url:
          description: Where this site serves those bytes; null when it has no terms with that fingerprint.
          type:
          - string
          - 'null'
        status:
          type: string
          description: What updating the prices now would leave; unopened before the first deposit.
          enum:
          - unopened
          - pending
          - active
          - ended
        end_reason:
          type:
          - string
          - 'null'
          enum:
          - maturity
          - overnight_depleted
          - session_depleted
          - stale_feed
          - bad_price
          - feed_unreadable
          - null
        price:
          type: integer
          description: The last price, WAD dollars per stock token; 0 before the first.
        deposit_cap:
          type: integer
        deposited:
          type: integer
          description: Raw stock the series owes its tokens.
        held:
          type: integer
          description: Raw stock the series holds; below deposited only after the issuer took some.
        opening_paused:
          type: boolean
          description: Whether opening new weeks is paused; open weeks run on either way.
        prices_applied:
          type: integer
          description: Prices the series has once its due prices are applied.
        prices_waiting:
          type: integer
          description: Due prices nobody has applied on the chain yet; any wallet can apply them.
        feed_unreadable:
          type: boolean
          description: Whether the next price is due and the feed could not be read for it.
        feed_unreadable_since:
          description: When the series first found the feed unreadable, Unix seconds; the week ends if it
            still is 7 days later.
          type:
          - integer
          - 'null'
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/ExposureMoment'
        next:
          description: Null once the week has ended on the chain; otherwise the next price to apply.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ExposureMoment'
    ExposurePrice:
      type: object
      required:
      - index
      - at
      - kind
      - price
      - after_hours
      - market_hours
      - feed_round_id
      - feed_updated_at
      properties:
        index:
          type: integer
        at:
          type: integer
        kind:
          type: string
          enum:
          - open
          - close
        price:
          type: integer
        after_hours:
          type: integer
          description: After-hours ledger after this price, WAD.
        market_hours:
          type: integer
          description: Market-hours ledger after this price, WAD.
        feed_round_id:
          type: integer
        feed_updated_at:
          type: integer
    ExposureWeekEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/ExposureWeek'
          - type: object
            required:
            - prices
            properties:
              prices:
                description: Every price applied, oldest first; null when the feed refused to give back a
                  round the series used.
                oneOf:
                - type: 'null'
                - type: array
                  items:
                    $ref: '#/components/schemas/ExposurePrice'
    ExposureWeekListEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - factory
          - current_week
          - opening_paused
          - read_at
          - weeks
          properties:
            factory:
              type: string
            current_week:
              type: integer
            opening_paused:
              type: boolean
            read_at:
              type: string
              format: date-time
            weeks:
              type: array
              items:
                $ref: '#/components/schemas/ExposureWeek'
    ExposureHoldingsEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - week
          - series
          - wallet
          - read_at
          - after_hours
          - market_hours
          - stock
          - stock_allowance
          - usdc
          - returnable
          properties:
            week:
              type: integer
            series:
              type: string
            wallet:
              type: string
            read_at:
              type: string
              format: date-time
            after_hours:
              type: integer
            market_hours:
              type: integer
            stock:
              type: integer
            usdc:
              type: integer
              description: The wallet's USDC, in micro-units, for buying a token.
            stock_allowance:
              type: integer
              description: Raw stock the wallet lets the factory take for a deposit.
            returnable:
              type: object
              description: What redeem takes now (whole pairs before the end, every token after it) and
                the raw stock it pays.
              required:
              - after_hours
              - market_hours
              - stock
              properties:
                after_hours:
                  type: integer
                market_hours:
                  type: integer
                stock:
                  type: integer
    ExposureStepRequest:
      type: object
      additionalProperties: false
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - buy
          - sell
          - deposit
          - redeem
          - settle
        leg:
          type: string
          enum:
          - overnight
          - session
          description: For buy and sell, overnight for the After-hours token or session for the Market-hours token.
        signer:
          type: string
          description: One of the person's own wallets; omit it for the wallet they signed in with.
        amount:
          type: integer
          minimum: 1
          description: For buy, USDC micro-units to spend; for sell, raw token units; for deposit, raw stock
            units, this week only.
        overnight:
          type: integer
          minimum: 0
          description: For redeem, raw After-hours units; equal to session before the week ends.
        session:
          type: integer
          minimum: 0
          description: For redeem, raw Market-hours units; equal to overnight before the week ends.
    ExposureStepsEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - kind
          - week
          - signer
          - chain
          - steps
          - approved
          - blocked
          - facts
          properties:
            kind:
              type: string
              enum:
              - buy
              - sell
              - deposit
              - redeem
              - settle
            week:
              type: integer
            signer:
              type: string
            chain:
              type: object
              required:
              - chain_id
              - name
              - rpc_url
              properties:
                chain_id:
                  type: integer
                name:
                  type: string
                rpc_url:
                  type: string
            steps:
              type: array
              items:
                type: object
                required:
                - kind
                - step
                - to
                - data
                - value
                properties:
                  kind:
                    type: string
                    enum:
                    - transaction
                  step:
                    type: string
                    enum:
                    - usdc_approval
                    - token_approval
                    - buy
                    - sell
                    - stock_approval
                    - deposit
                    - redeem
                    - settle
                  to:
                    type: string
                  data:
                    type: string
                  value:
                    type: string
                    description: Hex wei; always 0x0.
            approved:
              type: boolean
            blocked:
              oneOf:
              - type: 'null'
              - type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    enum:
                    - no_liquidity
                    - too_small
                    - not_enough_usdc
                    - deposits_closed
                    - paused
                    - not_open
                    - ended
                    - above_cap
                    - backing_short
                    - not_enough_stock
                    - approve_first
                    - pair_required
                    - more_than_held
                  message:
                    type: string
            facts:
              type: object
              description: 'buy and sell: leg, amount, expected, minimum, usdc_decimals, slippage_bps.
                deposit: amount, room (raw stock the cap still takes). redeem: overnight, session, paid (null
                for unequal amounts before the end). settle: due (prices it would apply), ends (whether it
                ends the week), next (the next price, as in a week''s next).'
    ExposureError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - hint
          properties:
            code:
              type: string
              enum:
              - unknown_week
              - week_not_open
              - unknown_terms
              - invalid_amount
              - leg_required
              - invalid_request
              - wrong_signer
              - wallet_required
              - authentication_required
              - chain_unavailable
              - invalid_chain_response
              - invalid_block_header
              - wrong_chain
              - agent_not_paired
            message:
              type: string
            hint:
              type: string
