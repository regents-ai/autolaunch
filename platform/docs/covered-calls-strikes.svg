    <text x="106" y="450">$240</text>
    <text x="106" y="330">$245</text>
    <text x="106" y="210">$250</text>
  </g>

  <!-- Reference price -->
  <line class="price" x1="120" y1="439.5" x2="390" y2="439.5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="soft" x="390" y="460" font-size="12" text-anchor="end">Price $240.27</text>

  <!-- Targets (hollow) rounded up to strikes (solid lines) -->
  <g stroke-width="2.5">
    <line class="strike" x1="120" y1="374" x2="390" y2="374"/>
    <line class="strike" x1="120" y1="254" x2="390" y2="254"/>
    <line class="strike" x1="120" y1="134" x2="390" y2="134"/>
  </g>
  <g class="price" stroke-width="1.5" fill="none">
    <path d="M184 382 V376"/>
    <path d="M184 266.5 V256"/>
    <path d="M184 151.3 V136"/>
  </g>
  <g>
    <circle class="target" cx="184" cy="382" r="4.5" stroke-width="1.5"/>
    <circle class="target" cx="184" cy="266.5" r="4.5" stroke-width="1.5"/>
    <circle class="target" cx="184" cy="151.3" r="4.5" stroke-width="1.5"/>
  </g>
  <g class="soft" font-size="12">
    <text x="138" y="398">+1% $242.67</text>
    <text x="138" y="283">+3% $247.48</text>
