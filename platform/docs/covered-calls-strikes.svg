  <line class="axis" x1="120" y1="122" x2="120" y2="470" stroke-width="1.5"/>
  <g class="line" stroke-width="1">
    <line x1="114" y1="446" x2="126" y2="446"/>
    <line x1="114" y1="422" x2="126" y2="422"/>
    <line x1="114" y1="398" x2="126" y2="398"/>
    <line x1="114" y1="374" x2="126" y2="374"/>
    <line x1="114" y1="350" x2="126" y2="350"/>
    <line x1="114" y1="326" x2="126" y2="326"/>
    <line x1="114" y1="302" x2="126" y2="302"/>
    <line x1="114" y1="278" x2="126" y2="278"/>
    <line x1="114" y1="254" x2="126" y2="254"/>
    <line x1="114" y1="230" x2="126" y2="230"/>
    <line x1="114" y1="206" x2="126" y2="206"/>
    <line x1="114" y1="182" x2="126" y2="182"/>
    <line x1="114" y1="158" x2="126" y2="158"/>
    <line x1="114" y1="134" x2="126" y2="134"/>
