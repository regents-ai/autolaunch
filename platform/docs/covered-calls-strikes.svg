    <rect x="590" y="244" width="100" height="40" rx="6"/>
    <rect x="710" y="244" width="100" height="40" rx="6"/>
    <rect x="830" y="244" width="100" height="40" rx="6"/>
    <rect x="590" y="300" width="100" height="40" rx="6"/>
    <rect x="710" y="300" width="100" height="40" rx="6"/>
    <rect x="830" y="300" width="100" height="40" rx="6"/>
    <rect x="590" y="356" width="100" height="40" rx="6"/>
    <rect x="710" y="356" width="100" height="40" rx="6"/>
    <rect x="830" y="356" width="100" height="40" rx="6"/>
  </g>
  <g class="ink" font-size="15" text-anchor="middle" font-variant-numeric="tabular-nums">
    <text x="640" y="213">$2.75</text>
    <text x="760" y="213">$1.27</text>
    <text x="880" y="213">$0.51</text>
    <text x="640" y="269">$4.38</text>
    <text x="760" y="269">$2.65</text>
    <text x="880" y="269">$1.49</text>
    <text x="640" y="325">$5.63</text>
    <text x="760" y="325">$3.79</text>
    <text x="880" y="325">$2.44</text>
    <text x="640" y="381">$6.70</text>
    <text x="760" y="381">$4.79</text>
    <text x="880" y="381">$3.32</text>
  </g>
  <text class="soft" x="450" y="428" font-size="12">Before the 1% fee. Fixed 30% yearly volatility,</text>
  <text class="soft" x="450" y="446" font-size="12">counted to the close of each Fri–Sat window.</text>
  <text class="soft" x="450" y="500" font-size="12">The seller picks one strike. The premium starts at the suggestion</text>
  <text class="soft" x="450" y="518" font-size="12">and stays theirs to change; it is earned only when a buyer fills.</text>
</svg>
