  <text class="ink" x="450" y="112" font-size="15" font-weight="600">Suggested premium per AMZNc</text>
  <g class="accent" font-size="14" font-weight="650" text-anchor="middle">
    <text x="640" y="152">$243</text>
    <text x="760" y="152">$248</text>
    <text x="880" y="152">$253</text>
  </g>
  <g class="soft" font-size="12" text-anchor="middle">
    <text x="640" y="170">+1.1%</text>
    <text x="760" y="170">+3.2%</text>
    <text x="880" y="170">+5.3%</text>
  </g>
  <g class="ink" font-size="14">
    <text x="450" y="214">Fri 6 Nov</text>
    <text x="450" y="270">Fri 13 Nov</text>
    <text x="450" y="326">Fri 20 Nov</text>
    <text x="450" y="382">Fri 27 Nov</text>
