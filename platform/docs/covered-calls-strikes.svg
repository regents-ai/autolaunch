<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">AMZNc strike set</title>
  <desc id="d">The reference price of 240.27 dollars, the targets 1, 3 and 5 percent above it rounded up to a 1 dollar step to give strikes of 243, 248 and 253 dollars, and the suggested premium at each strike for the next four Fridays.</desc>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1d2430; }
    .soft { fill: #5b6474; }
    .line { stroke: #c9ced8; }
    .axis { stroke: #1d2430; }
    .price { stroke: #5b6474; }
    .strike { stroke: #2357c6; }
    .accent { fill: #2357c6; }
    .cell { fill: #eef3fd; stroke: #c4d3f3; }
    .target { fill: #ffffff; stroke: #5b6474; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #141922; }
      .ink { fill: #e7eaf0; }
      .soft { fill: #a3abb9; }
      .line { stroke: #39414f; }
      .axis { stroke: #e7eaf0; }
      .price { stroke: #a3abb9; }
      .strike { stroke: #7da2f0; }
      .accent { fill: #7da2f0; }
      .cell { fill: #1c2740; stroke: #34466d; }
      .target { fill: #141922; stroke: #a3abb9; }
    }
  </style>
  <rect class="bg" width="960" height="540"/>

  <text class="ink" x="32" y="46" font-size="24" font-weight="650">AMZNc strike set</text>
  <text class="soft" x="32" y="72" font-size="14">Reference price $240.27 · strike step $1 · read 1 Nov 2026, 00:06 UTC</text>

