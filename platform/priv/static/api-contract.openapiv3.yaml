openapi: 3.1.0
info:
  title: Autolaunch API
  version: 1.0.0
paths:
  /api/v1/profile:
    get:
      operationId: profile_get
      summary: Get the verified owner’s shared profile
      security:
        - PrivyAccess: []
          PrivyIdentity: []
      responses:
        "200":
          description: Owner-only shared profile
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Paired proof required
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Owner access refused
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Profile not created
          content:
            application/json:
              schema:
                type: object
        "409":
          description: Conflicting or stale verification
          content:
            application/json:
              schema:
                type: object
        "422":
          description: Invalid profile edit
          content:
            application/json:
              schema:
                type: object
        "503":
          description: Profile unavailable
          content:
            application/json:
              schema:
                type: object
    patch:
      operationId: profile_update
      summary: Update the verified owner’s shared profile
      security:
        - PrivyAccess: []
          PrivyIdentity: []
      responses:
        "200":
          description: Owner-only shared profile
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Paired proof required
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Owner access refused
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Profile not created
          content:
            application/json:
              schema:
                type: object
        "409":
          description: Conflicting or stale verification
          content:
            application/json:
              schema:
                type: object
        "422":
          description: Invalid profile edit
          content:
            application/json:
              schema:
                type: object
        "503":
          description: Profile unavailable
          content:
            application/json:
              schema:
                type: object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                display_name:
                  type:
                    - string
                    - "null"
                  maxLength: 80
                wallet_address:
                  type:
                    - string
                    - "null"
                  pattern: ^0x[a-fA-F0-9]{40}$
  /api/v1/profile/sync:
    post:
      operationId: profile_sync
      summary: Sync the verified owner’s shared profile
      security:
        - PrivyAccess: []
          PrivyIdentity: []
      responses:
        "200":
          description: Owner-only shared profile
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Paired proof required
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Owner access refused
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Profile not created
          content:
            application/json:
              schema:
                type: object
        "409":
          description: Conflicting or stale verification
          content:
            application/json:
              schema:
                type: object
        "422":
          description: Invalid profile edit
          content:
            application/json:
              schema:
                type: object
        "503":
          description: Profile unavailable
          content:
            application/json:
              schema:
                type: object
  /api/v1/auctions:
    get:
      operationId: listAuctions
      security: []
      parameters:
        - {$ref: "#/components/parameters/Search"}
        - name: state
          in: query
          description: "Auctions in one state: created (opening soon), active (live), ended (bidding closed, waiting to be finished), failed, graduated (launched)."
          schema:
            type: string
            enum: [all, created, active, ended, failed, graduated]
            default: all
        - name: sort
          in: query
          description: "newest: most recently listed first (the website's Recent). ending: live auctions only, closing soonest first (Closing). volume: highest dollar bid volume first, unrecorded volume last (Highest)."
          schema:
            type: string
            enum: [newest, ending, volume]
            default: newest
        - {$ref: "#/components/parameters/Chain"}
        - {$ref: "#/components/parameters/Kind"}
        - {$ref: "#/components/parameters/X"}
        - {$ref: "#/components/parameters/Ens"}
        - {$ref: "#/components/parameters/Github"}
        - name: limit
          in: query
          description: Values outside the admitted range are clamped to the nearest boundary.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - name: after
          in: query
          description: Opaque next_cursor from the preceding page. Keep the same filters and sort. Expires after 24 hours; restart the listing on 400. New records ahead of the cursor appear when restarting; this is not a frozen snapshot.
          schema: {type: string, maxLength: 4096}
      x-pagination: keyset
      responses:
        "200":
          description: Public Autolaunch auctions on Base and Robinhood, found and ordered as the website's auction list finds and orders them; every entry names its chain.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuctionListEnvelope"}
        "400": {$ref: "#/components/responses/InvalidQuery"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/auctions/{id}:
    get:
      operationId: getAuction
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: "An auction's UUID, or a Robinhood auction's contract address."
          schema:
            oneOf:
              - {type: string, format: uuid}
              - {type: string, pattern: "^0x[0-9a-fA-F]{40}$"}
      responses:
        "200":
          description: Public Autolaunch auction on Base or Robinhood
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuctionEnvelope"}
        "400": {$ref: "#/components/responses/InvalidQuery"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/auctions/{id}/bid-quote:
    post:
      operationId: quoteAuctionBid
      security: []
      parameters:
        - {$ref: "#/components/parameters/AuctionId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuctionBidRequest"}
      responses:
        "200":
          description: Quote from the stored auction snapshot
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuctionBidQuoteEnvelope"}
        "400": {$ref: "#/components/responses/InvalidQuery"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/tokens:
    get:
      operationId: listTokens
      security: []
      parameters:
        - {$ref: "#/components/parameters/Search"}
        - {$ref: "#/components/parameters/Chain"}
        - {$ref: "#/components/parameters/Kind"}
        - {$ref: "#/components/parameters/X"}
        - {$ref: "#/components/parameters/Ens"}
        - {$ref: "#/components/parameters/Github"}
        - name: limit
          in: query
          description: Values outside the admitted range are clamped to the nearest boundary.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: after
          in: query
          description: Opaque next_cursor from the preceding page. Keep the same filters and sort. Expires after 24 hours; restart the listing on 400. New records ahead of the cursor appear when restarting; this is not a frozen snapshot.
          schema: {type: string, maxLength: 4096}
      x-pagination: keyset
      responses:
        "200":
          description: Public Autolaunch tokens on Base and Robinhood, found as the website's token list finds them, newest graduation first; every entry names its chain.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenListEnvelope"}
        "400": {$ref: "#/components/responses/InvalidQuery"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/treasury-security/{address}:
    get:
      operationId: getTreasurySecurity
      security: []
      parameters:
        - name: address
          in: path
          required: true
          schema: {type: string, pattern: '^0x[0-9a-fA-F]{40}$'}
      responses:
        "200":
          description: Newest stored treasury observation; this read never calls a provider
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TreasurySecurityEnvelope"}
        "400": {$ref: "#/components/responses/InvalidQuery"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
components:
  securitySchemes:
    PrivyAccess:
      type: http
      scheme: bearer
    PrivyIdentity:
      type: apiKey
      in: header
      name: privy-id-token
  parameters:
    AuctionId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Search:
      name: q
      in: query
      description: "The website's search. Every word must appear in the name, ticker, stock, description, an address or one of the creator's verified accounts; a leading $ on a word is ignored. Spaces are collapsed and the search is cut to its first 80 characters."
      schema: {type: string}
    Chain:
      name: chain
      in: query
      schema: {type: string, enum: [all, base, robinhood], default: all}
    Kind:
      name: kind
      in: query
      description: "Launch type: revstake or memestake."
      schema: {type: string, enum: [all, revstake, memestake], default: all}
    X:
      name: x
      in: query
      description: "true: only launches whose creator has a verified X account."
      schema: {type: boolean, default: false}
    Ens:
      name: ens
      in: query
      description: "true: only launches whose creator has a verified ENS name."
      schema: {type: boolean, default: false}
    Github:
      name: github
      in: query
      description: "true: only launches whose creator has a verified GitHub account. Several true filters must all hold."
      schema: {type: boolean, default: false}
  responses:
    InvalidQuery:
      description: Request query parameters are invalid
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
          examples:
            invalidQuery:
              value: {error: {code: invalid_request, message: The query parameters are invalid.}}
    NotFound:
      description: The requested public record was not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/NotFoundApiError"}
          examples:
            notFound:
              value: {error: {code: not_found, message: The requested record was not found.}}
    InternalError:
      description: The request could not be completed
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
          examples:
            internalError:
              value: {error: {code: internal_error, message: The request could not be completed.}}
  schemas:
    AuctionBidRequest:
      type: object
      additionalProperties: false
      required: [amount, max_price]
      properties:
        amount: {type: string, pattern: '^\d+(?:\.\d+)?$'}
        max_price: {type: string, pattern: '^\d+(?:\.\d+)?$'}
    AuctionBidQuoteEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - auction_id
            - amount
            - max_price
            - quote_token
            - current_clearing_price
            - projected_clearing_price
            - would_be_active_now
            - status_band
            - estimated_tokens_if_end_now
            - warnings
          properties:
            auction_id: {type: string, format: uuid}
            amount: {type: string}
            max_price: {type: string}
            quote_token: {$ref: "#/components/schemas/QuoteToken"}
            current_clearing_price: {type: string}
            projected_clearing_price: {type: string}
            would_be_active_now: {type: boolean}
            status_band: {type: string, enum: [active, borderline, inactive]}
            estimated_tokens_if_end_now: {type: string}
            warnings: {type: array, items: {type: string}}
    QuoteToken:
      description: The token bids are paid in. REGENT for revstake auctions; the auction's stock token (on Base or Robinhood) for memestake auctions.
      type: object
      additionalProperties: false
      required: [address, symbol, decimals]
      properties:
        address: {type: [string, "null"]}
        symbol: {type: [string, "null"]}
        decimals: {type: [integer, "null"], minimum: 0, maximum: 36}
    Pagination:
      type: object
      additionalProperties: false
      required: [has_more, next_cursor]
      properties:
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    AuctionListEnvelope:
      type: object
      additionalProperties: false
      required: [data, pagination, robinhood_unavailable]
      properties:
        pagination: {$ref: "#/components/schemas/Pagination"}
        robinhood_unavailable: {type: boolean, description: "Robinhood could not be read just now, so its entries show what was last read from it."}
        data:
          type: array
          items: {$ref: "#/components/schemas/Auction"}
    AuctionEnvelope:
      type: object
      additionalProperties: false
      required: [data, robinhood_unavailable]
      properties:
        robinhood_unavailable: {type: boolean, description: "Robinhood could not be read just now, so a Robinhood auction shows what was last read from it."}
        data: {$ref: "#/components/schemas/Auction"}
    DecimalString:
      type: string
      pattern: '^\d+(?:\.\d+)?$'
      description: An exact decimal number as a string; never rounded through a float.
    Auction:
      description: An auction on Base or Robinhood, as the site records it. Every figure the record does not hold yet is null, and `unavailable` names why.
      type: object
      additionalProperties: false
      required: [id, chain, chain_id, address, url, title, token_symbol, summary, featured, kind, state, opened_at, estimated_end_at, quote_token, clearing_price, token_allocation, bid_volume, bid_volume_usd, minimum_raise, currency_raised, percent_met, minimum_reached, record_updated_at, unavailable, treasury_security]
      properties:
        id: {type: string, format: uuid}
        chain: {type: string, enum: [base, robinhood]}
        chain_id: {type: integer, minimum: 1}
        address: {type: string, pattern: "^0x[0-9a-fA-F]{40}$", description: "The auction contract's address."}
        url: {type: string, format: uri, description: "The auction's page on the website."}
        title: {type: string}
        token_symbol: {type: [string, "null"]}
        summary: {type: [string, "null"]}
        featured: {type: boolean}
        kind: {type: string, enum: [revstake, memestake], description: "The launch type: a Revstake or a Memestake launch."}
        state: {type: string, enum: [created, active, ended, graduated, failed], description: "ended: bidding has closed and the auction is waiting to be finished; graduated and failed are final."}
        opened_at: {type: [string, "null"], format: date-time}
        estimated_end_at: {type: [string, "null"], format: date-time, description: "When bidding closes, estimated from the auction's end block and the chain's block times."}
        quote_token: {$ref: "#/components/schemas/QuoteToken"}
        clearing_price: {type: [string, "null"], description: "The auction's current clearing price in the quote token, as a decimal string."}
        token_allocation: {allOf: [{$ref: "#/components/schemas/DecimalString"}], description: "Whole tokens the auction sells, fixed by its launch type: 10 billion of a Revstake token's 100 billion, 800 million of a Memestake token's 1 billion."}
        bid_volume:
          description: Everything bid so far, in whole quote-token units.
          oneOf: [{$ref: "#/components/schemas/DecimalString"}, {type: "null"}]
        bid_volume_usd:
          description: The bid volume in US dollars at the quote token's price when the bid history was recorded.
          oneOf: [{$ref: "#/components/schemas/DecimalString"}, {type: "null"}]
        minimum_raise: {allOf: [{$ref: "#/components/schemas/DecimalString"}], description: "What the auction must raise to launch (its launch threshold), in whole quote-token units. If it ends short, every bid is returned."}
        currency_raised:
          description: What the auction has raised so far, in whole quote-token units, as the site last recorded it from the chain.
          oneOf: [{$ref: "#/components/schemas/DecimalString"}, {type: "null"}]
        percent_met: {type: [integer, "null"], minimum: 0, maximum: 100, description: "currency_raised as a whole percent of minimum_raise, rounded down and capped at 100, as the website shows it."}
        minimum_reached: {type: boolean, description: "Whether the auction contract reports the minimum met so far. A progress fact only: bidding stays open until the end block."}
        record_updated_at: {type: string, format: date-time, description: "When the site's stored record of this auction was last written. Writes include the site's own scheduling of its chain reads, so this is not the time of the latest successful chain reading; the site keeps no such time."}
        unavailable:
          type: object
          additionalProperties: false
          description: "One entry for each figure that is null, naming why. not_recorded_yet: the site's chain readers have not recorded it yet (they may still be reading or retrying). chain_unreadable: Robinhood's last read of its chain failed and the figure was never recorded. no_usd_price: the bid volume was recorded while the quote token had no known dollar price."
          properties:
            estimated_end_at: {type: string, enum: [not_recorded_yet]}
            bid_volume: {type: string, enum: [not_recorded_yet]}
            bid_volume_usd: {type: string, enum: [not_recorded_yet, no_usd_price]}
            currency_raised: {type: string, enum: [not_recorded_yet, chain_unreadable]}
            percent_met: {type: string, enum: [not_recorded_yet, chain_unreadable]}
        treasury_security:
          oneOf:
            - {$ref: "#/components/schemas/TreasurySecurity"}
            - {type: "null"}
    TokenListEnvelope:
      type: object
      additionalProperties: false
      required: [data, pagination, robinhood_unavailable]
      properties:
        pagination: {$ref: "#/components/schemas/Pagination"}
        robinhood_unavailable: {type: boolean, description: "Robinhood could not be read just now, so its entries show what was last read from it."}
        data:
          type: array
          items: {$ref: "#/components/schemas/Token"}
    Token:
      description: A graduated token on Base or Robinhood, as the site records it.
      type: object
      additionalProperties: false
      required: [id, chain, chain_id, address, auction_id, subject_id, name, symbol, summary, graduated_at, top_rank, treasury_security]
      properties:
        id: {type: string, format: uuid}
        chain: {type: string, enum: [base, robinhood]}
        chain_id: {type: integer, minimum: 1}
        address: {type: [string, "null"], pattern: "^0x[0-9a-fA-F]{40}$", description: "The token contract's address, recorded for Robinhood tokens, whose page is /robinhood/tokens/{address}. A Base token's page is /tokens/{id}."}
        auction_id: {type: string, format: uuid}
        subject_id: {type: [string, "null"]}
        name: {type: string}
        symbol: {type: string}
        summary: {type: [string, "null"]}
        graduated_at: {type: string, format: date-time}
        top_rank: {type: [integer, "null"], minimum: 1}
        treasury_security:
          oneOf:
            - {$ref: "#/components/schemas/TreasurySecurity"}
            - {type: "null"}
    TreasurySecurityEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/TreasurySecurity"}
    TreasurySecurity:
      type: object
      additionalProperties: false
      required: [id, address, chain_id, classification, verification_state, verification_reason, downgrade_state, configuration_fingerprint, source_block_number, source_block_hash, observed_at, safe, evidence]
      properties:
        id: {type: string, format: uuid}
        address: {type: string, pattern: '^0x[0-9a-f]{40}$'}
        chain_id: {type: integer, enum: [8453]}
        classification: {type: string, enum: [supported_safe, safe_1_of_1, eoa, delegated_eoa, unknown_contract, split, unsupported]}
        verification_state: {type: string, enum: [awaiting_current_chain_confirmation]}
        verification_reason: {type: string, enum: [projector_refresh_not_integrated]}
        downgrade_state: {type: string, enum: [none, downgraded]}
        configuration_fingerprint: {type: string, pattern: '^0x[0-9a-f]{64}$'}
        source_block_number: {type: integer, minimum: 0}
        source_block_hash: {type: string, pattern: '^0x[0-9a-f]{64}$'}
        observed_at: {type: string, format: date-time}
        safe: {type: [object, "null"], additionalProperties: true}
        evidence:
          type: object
          additionalProperties: false
          required: [usdc, regent, outbound]
          properties:
            usdc: {type: [object, "null"], additionalProperties: true}
            regent: {type: [object, "null"], additionalProperties: true}
            outbound: {type: [object, "null"], additionalProperties: true}
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string, enum: [invalid_request, internal_error]}
            message: {type: string}
    NotFoundApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string, enum: [not_found]}
            message: {type: string}
