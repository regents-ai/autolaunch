openapi: 3.1.0
info:
  title: Autolaunch API
  version: 1.0.0
paths:
  /api/v1/profile:
    get:
      operationId: profile_get
      summary: Get the verified owner’s shared profile
      security:
        - PrivyAccess: []
          PrivyIdentity: []
      responses:
        "200":
          description: Owner-only shared profile
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Paired proof required
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Owner access refused
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Profile not created
          content:
            application/json:
              schema:
                type: object
        "409":
          description: Conflicting or stale verification
          content:
            application/json:
              schema:
                type: object
        "422":
          description: Invalid profile edit
          content:
            application/json:
              schema:
                type: object
        "503":
          description: Profile unavailable
          content:
            application/json:
              schema:
                type: object
    patch:
      operationId: profile_update
      summary: Update the verified owner’s shared profile
      security:
        - PrivyAccess: []
          PrivyIdentity: []
      responses:
        "200":
          description: Owner-only shared profile
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Paired proof required
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Owner access refused
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Profile not created
          content:
            application/json:
              schema:
                type: object
        "409":
          description: Conflicting or stale verification
          content:
            application/json:
              schema:
                type: object
        "422":
          description: Invalid profile edit
          content:
            application/json:
              schema:
                type: object
        "503":
          description: Profile unavailable
          content:
            application/json:
              schema:
                type: object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                display_name:
                  type:
                    - string
                    - "null"
                  maxLength: 80
                wallet_address:
                  type:
                    - string
                    - "null"
                  pattern: ^0x[a-fA-F0-9]{40}$
  /api/v1/profile/sync:
    post:
      operationId: profile_sync
      summary: Sync the verified owner’s shared profile
      security:
        - PrivyAccess: []
          PrivyIdentity: []
      responses:
        "200":
          description: Owner-only shared profile
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Paired proof required
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Owner access refused
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Profile not created
          content:
            application/json:
              schema:
                type: object
        "409":
          description: Conflicting or stale verification
          content:
            application/json:
              schema:
                type: object
        "422":
          description: Invalid profile edit
          content:
            application/json:
              schema:
                type: object
        "503":
          description: Profile unavailable
          content:
            application/json:
              schema:
                type: object
  /api/v1/auctions:
    get:
      operationId: listAuctions
      security: []
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum: [all, biddable, live, ended, failed_minimum, graduated]
            default: all
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
        - name: limit
          in: query
          description: Values outside the admitted range are clamped to the nearest boundary.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - name: after
          in: query
          description: Opaque next_cursor from the preceding page. Keep the same filters and sort. Expires after 24 hours; restart the listing on 400. New records ahead of the cursor appear when restarting; this is not a frozen snapshot.
          schema: {type: string, maxLength: 4096}
      x-pagination: keyset
      responses:
        "200":
          description: Public Autolaunch auctions on Base and Robinhood in one date order; every entry names its chain. Mode and sort apply to both chains.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuctionListEnvelope"}
        "400": {$ref: "#/components/responses/InvalidQuery"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/auctions/{id}:
    get:
      operationId: getAuction
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: "An auction's UUID, or a Robinhood auction's contract address."
          schema:
            oneOf:
              - {type: string, format: uuid}
              - {type: string, pattern: "^0x[0-9a-fA-F]{40}$"}
      responses:
        "200":
          description: Public Autolaunch auction on Base or Robinhood
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuctionEnvelope"}
        "400": {$ref: "#/components/responses/InvalidQuery"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/auctions/{id}/bid-quote:
    post:
      operationId: quoteAuctionBid
      security: []
      parameters:
        - {$ref: "#/components/parameters/AuctionId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuctionBidRequest"}
      responses:
        "200":
          description: Quote from the stored auction snapshot
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuctionBidQuoteEnvelope"}
        "400": {$ref: "#/components/responses/InvalidQuery"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/tokens:
    get:
      operationId: listTokens
      security: []
      parameters:
        - name: limit
          in: query
          description: Values outside the admitted range are clamped to the nearest boundary.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: after
          in: query
          description: Opaque next_cursor from the preceding page. Keep the same filters and sort. Expires after 24 hours; restart the listing on 400. New records ahead of the cursor appear when restarting; this is not a frozen snapshot.
          schema: {type: string, maxLength: 4096}
      x-pagination: keyset
      responses:
        "200":
          description: Public Autolaunch tokens on Base and Robinhood, newest graduation first; every entry names its chain.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenListEnvelope"}
        "400": {$ref: "#/components/responses/InvalidQuery"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/treasury-security/{address}:
    get:
      operationId: getTreasurySecurity
      security: []
      parameters:
        - name: address
          in: path
          required: true
          schema: {type: string, pattern: '^0x[0-9a-fA-F]{40}$'}
      responses:
        "200":
          description: Newest stored treasury observation; this read never calls a provider
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TreasurySecurityEnvelope"}
        "400": {$ref: "#/components/responses/InvalidQuery"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
components:
  securitySchemes:
    PrivyAccess:
      type: http
      scheme: bearer
    PrivyIdentity:
      type: apiKey
      in: header
      name: privy-id-token
  parameters:
    AuctionId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    InvalidQuery:
      description: Request query parameters are invalid
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
          examples:
            invalidQuery:
              value: {error: {code: invalid_request, message: The query parameters are invalid.}}
    NotFound:
      description: The requested public record was not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/NotFoundApiError"}
          examples:
            notFound:
              value: {error: {code: not_found, message: The requested record was not found.}}
    InternalError:
      description: The request could not be completed
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
          examples:
            internalError:
              value: {error: {code: internal_error, message: The request could not be completed.}}
  schemas:
    AuctionBidRequest:
      type: object
      additionalProperties: false
      required: [amount, max_price]
      properties:
        amount: {type: string, pattern: '^\d+(?:\.\d+)?$'}
        max_price: {type: string, pattern: '^\d+(?:\.\d+)?$'}
    AuctionBidQuoteEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - auction_id
            - amount
            - max_price
            - quote_token
            - current_clearing_price
            - projected_clearing_price
            - would_be_active_now
            - status_band
            - estimated_tokens_if_end_now
            - warnings
          properties:
            auction_id: {type: string, format: uuid}
            amount: {type: string}
            max_price: {type: string}
            quote_token: {$ref: "#/components/schemas/QuoteToken"}
            current_clearing_price: {type: string}
            projected_clearing_price: {type: string}
            would_be_active_now: {type: boolean}
            status_band: {type: string, enum: [active, borderline, inactive]}
            estimated_tokens_if_end_now: {type: string}
            warnings: {type: array, items: {type: string}}
    QuoteToken:
      description: The token bids are paid in. REGENT for agent auctions; the admitted Base stock token for stocks auctions.
      type: object
      additionalProperties: false
      required: [address, symbol, decimals]
      properties:
        address: {type: [string, "null"]}
        symbol: {type: [string, "null"]}
        decimals: {type: [integer, "null"], minimum: 0, maximum: 36}
    Pagination:
      type: object
      additionalProperties: false
      required: [has_more, next_cursor]
      properties:
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
    AuctionListEnvelope:
      type: object
      additionalProperties: false
      required: [data, pagination, robinhood_unavailable]
      properties:
        pagination: {$ref: "#/components/schemas/Pagination"}
        robinhood_unavailable: {type: boolean, description: "Robinhood could not be read just now, so its entries show what was last read from it."}
        data:
          type: array
          items: {$ref: "#/components/schemas/Auction"}
    AuctionEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Auction"}
    Auction:
      description: An auction on Base or Robinhood, as the site records it.
      type: object
      additionalProperties: false
      required: [id, chain, chain_id, address, title, token_symbol, summary, featured, kind, state, minimum_reached, opened_at, quote_token, clearing_price, treasury_security]
      properties:
        id: {type: string, format: uuid}
        chain: {type: string, enum: [base, robinhood]}
        chain_id: {type: integer, minimum: 1}
        address: {type: string, pattern: "^0x[0-9a-fA-F]{40}$", description: "The auction contract's address. On either chain the auction's page is /auctions/{token_symbol}/{tail} and its token's is /tokens/{token_symbol}/{tail}, where the tail is the last five characters of this address in lowercase, or more when another auction with the same symbol shares them."}
        title: {type: string}
        token_symbol: {type: [string, "null"]}
        summary: {type: [string, "null"]}
        featured: {type: boolean}
        kind: {type: string, enum: [agent, stocks]}
        state: {type: string, enum: [created, active, ended, graduated, failed], description: "ended: bidding has closed and the auction is waiting to be finished; graduated and failed are final."}
        minimum_reached: {type: boolean, description: "Whether the raise has met its minimum so far. A progress fact only: bidding stays open until the end block."}
        opened_at: {type: [string, "null"], format: date-time}
        quote_token: {$ref: "#/components/schemas/QuoteToken"}
        clearing_price: {type: [string, "null"], description: "The auction's current clearing price in the quote token, as a decimal string."}
        treasury_security:
          oneOf:
            - {$ref: "#/components/schemas/TreasurySecurity"}
            - {type: "null"}
    TokenListEnvelope:
      type: object
      additionalProperties: false
      required: [data, pagination, robinhood_unavailable]
      properties:
        pagination: {$ref: "#/components/schemas/Pagination"}
        robinhood_unavailable: {type: boolean, description: "Robinhood could not be read just now, so its entries show what was last read from it."}
        data:
          type: array
          items: {$ref: "#/components/schemas/Token"}
    Token:
      description: A graduated token on Base or Robinhood, as the site records it.
      type: object
      additionalProperties: false
      required: [id, chain, chain_id, address, auction_id, subject_id, name, symbol, summary, graduated_at, top_rank, treasury_security]
      properties:
        id: {type: string, format: uuid}
        chain: {type: string, enum: [base, robinhood]}
        chain_id: {type: integer, minimum: 1}
        address: {type: [string, "null"], pattern: "^0x[0-9a-fA-F]{40}$", description: "The token contract's address, recorded for Robinhood tokens. A token's page is /tokens/{token_symbol}/{tail}, named by the auction it launched from (see the Auction address)."}
        auction_id: {type: string, format: uuid}
        subject_id: {type: [string, "null"]}
        name: {type: string}
        symbol: {type: string}
        summary: {type: [string, "null"]}
        graduated_at: {type: string, format: date-time}
        top_rank: {type: [integer, "null"], minimum: 1}
        treasury_security:
          oneOf:
            - {$ref: "#/components/schemas/TreasurySecurity"}
            - {type: "null"}
    TreasurySecurityEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/TreasurySecurity"}
    TreasurySecurity:
      type: object
      additionalProperties: false
      required: [id, address, chain_id, classification, verification_state, verification_reason, downgrade_state, configuration_fingerprint, source_block_number, source_block_hash, observed_at, safe, evidence]
      properties:
        id: {type: string, format: uuid}
        address: {type: string, pattern: '^0x[0-9a-f]{40}$'}
        chain_id: {type: integer, enum: [8453]}
        classification: {type: string, enum: [supported_safe, safe_1_of_1, eoa, delegated_eoa, unknown_contract, split, unsupported]}
        verification_state: {type: string, enum: [awaiting_current_chain_confirmation]}
        verification_reason: {type: string, enum: [projector_refresh_not_integrated]}
        downgrade_state: {type: string, enum: [none, downgraded]}
        configuration_fingerprint: {type: string, pattern: '^0x[0-9a-f]{64}$'}
        source_block_number: {type: integer, minimum: 0}
        source_block_hash: {type: string, pattern: '^0x[0-9a-f]{64}$'}
        observed_at: {type: string, format: date-time}
        safe: {type: [object, "null"], additionalProperties: true}
        evidence:
          type: object
          additionalProperties: false
          required: [usdc, regent, outbound]
          properties:
            usdc: {type: [object, "null"], additionalProperties: true}
            regent: {type: [object, "null"], additionalProperties: true}
            outbound: {type: [object, "null"], additionalProperties: true}
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string, enum: [invalid_request, internal_error]}
            message: {type: string}
    NotFoundApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string, enum: [not_found]}
            message: {type: string}
