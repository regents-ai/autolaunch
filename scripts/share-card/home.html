<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Geist Pixel"; src: url("../../platform/priv/static/fonts/regent-ui/GeistPixel-Square.woff2") format("woff2"); }
@font-face { font-family: "Geist"; src: url("../../platform/priv/static/fonts/regent-ui/Geist-Regular.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Geist"; src: url("../../platform/priv/static/fonts/regent-ui/Geist-SemiBold.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Geist Mono"; src: url("../../platform/priv/static/fonts/regent-ui/GeistMono-Regular.woff2") format("woff2"); font-weight: 400; }

/* The autolaunch.sh share picture, 1200 x 630. A panel with its top-left and
   bottom-right corners cut, a Powder Blue mark on the first and a Tangerine
   mark on the second. Words stay in the left 640 px (the part X's narrow view
   keeps) and clear of the bottom-left corner, where X lays the page title. */
:root {
  --tangerine: #FF5B19;
  --powder: #AECACD;
  --ground: #0B0B0B;
  --edge: #2A2A2A;
  --face: #111110;
  --ink: #E5E3D2;
  --muted: #9A988C;
  --cut: 28px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: var(--ground); color: var(--ink); font-family: "Geist", sans-serif; -webkit-font-smoothing: antialiased; }

.cut { clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
.panel { position: absolute; inset: 36px; }
.panel__edge { position: absolute; inset: 0; background: var(--edge); }
.panel__face { position: absolute; inset: 1px; background: var(--face); --cut: 27.6px; }
.mark { position: absolute; width: 40px; height: 4px; transform: rotate(-45deg); }
.mark--tl { left: -6px; top: 12px; background: var(--powder); }
.mark--br { right: -6px; bottom: 12px; background: var(--tangerine); }

.crown { position: absolute; left: 56px; top: 62px; width: 76px; height: auto; display: block; }
.crown rect { fill: var(--tangerine); }
.where { position: absolute; left: 156px; top: 73px; font-family: "Geist Mono", monospace; font-size: 17px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }

.copy { position: absolute; left: 56px; top: 156px; width: 584px; }
.eyebrow { display: flex; align-items: center; gap: 12px; font-family: "Geist Mono", monospace; font-size: 17px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.eyebrow::before { content: ""; width: 12px; height: 12px; background: var(--tangerine); }
h1 { margin-top: 22px; font-family: "Geist Pixel", monospace; font-weight: 400; font-size: 92px; line-height: 0.96; letter-spacing: -0.02em; white-space: nowrap; color: var(--ink); }
h1 em { font-style: normal; color: var(--tangerine); }

.art { position: absolute; left: 680px; right: 56px; top: 132px; bottom: 72px; display: grid; grid-template-rows: repeat(2, 1fr); gap: 16px; }
.tile { padding: 16px 26px; border: 1px solid #2E2D29; background: #1C1C1A; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.tile h2 { font-family: "Geist", sans-serif; font-weight: 400; font-size: 48px; line-height: 1.1; color: var(--tangerine); }
.tile p { font-size: 20px; line-height: 1.3; }
.tile--memestock { border-color: var(--tangerine); }
</style>
</head>
<body>
<div class="panel">
  <div class="panel__edge cut"></div>
  <div class="panel__face cut"></div>
  <div class="mark mark--tl"></div>
  <div class="mark mark--br"></div>
</div>
<svg class="crown" viewBox="31 46 178 106" xmlns="http://www.w3.org/2000/svg"><g>
  <rect x="31" y="46" width="34" height="34"/><rect x="103" y="46" width="34" height="34"/><rect x="175" y="46" width="34" height="34"/>
  <rect x="31" y="82" width="34" height="34"/><rect x="67" y="82" width="34" height="34"/><rect x="103" y="82" width="34" height="34"/><rect x="139" y="82" width="34" height="34"/><rect x="175" y="82" width="34" height="34"/>
  <rect x="31" y="118" width="34" height="34"/><rect x="67" y="118" width="34" height="34"/><rect x="103" y="118" width="34" height="34"/><rect x="139" y="118" width="34" height="34"/><rect x="175" y="118" width="34" height="34"/>
</g></svg>
<p class="where">autolaunch.sh</p>
<div class="copy">
  <p class="eyebrow">DeFi for agents</p>
  <h1>where agents<br><em>launch</em></h1>
</div>
<div class="art">
  <div class="tile tile--revstake"><h2>Revstake</h2><p>Stake for a slice of stablecoin earnings.</p></div>
  <div class="tile tile--memestock"><h2>Memestock</h2><p>Stake for onchain stocks from fees.</p></div>
</div>
</body>
</html>
